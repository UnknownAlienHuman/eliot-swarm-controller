[package]
name = "swarm-kernel-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Headless local controller for native coding-agent harnesses"

[lib]
name = "swarm_kernel_host"
path = "src/lib.rs"

[[bin]]
name = "swarm-kernel-host"
path = "src/main.rs"

[dependencies]
atlas-redact = { path = "../../modules/atlas-redact" }
base64 = "=0.22.1"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
croner = { version = "4", features = ["chrono"] }
eventsource-stream = "=0.2.3"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
swarm-client = { path = "../swarm-client" }
swarm-bus = { path = "../swarm-bus" }
swarm-automation = { path = "../swarm-automation" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-kernel = { path = "../swarm-kernel" }
swarm-mcp = { path = "../swarm-mcp" }
swarm-process = { path = "../swarm-process" }
swarm-script-worker = { path = "../swarm-script-worker" }
swarm-scripts = { path = "../swarm-scripts" }
swarm-store = { path = "../swarm-store" }
swarm-supervisor = { path = "../swarm-supervisor" }
swarm-telemetry = { path = "../swarm-telemetry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-checks = { path = "../swarm-checks" }
swarm-observer = { path = "../swarm-observer" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

