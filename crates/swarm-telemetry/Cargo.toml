[package]
name = "swarm-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Bounded diagnostic producer with opt-in redacted text for the ELIOT swarm runtime"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
