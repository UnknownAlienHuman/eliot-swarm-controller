[package]
name = "swarm-adapter-muse"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Owned Muse MSP transport foundation; adapter facade not yet implemented"

[dependencies]
base64 = "=0.22.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jsonrpsee-core = { version = "=0.26.1", default-features = false, features = ["async-client", "server"] }
jsonschema = { version = "=0.58.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-contracts = { path = "../swarm-contracts" }
swarm-client = { path = "../swarm-client" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }

[dev-dependencies]
swarm-process = { path = "../swarm-process", features = ["test-support"] }
