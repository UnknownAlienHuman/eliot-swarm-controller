[package]
name = "swarm-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Independent bounded scheduler worker for ELIOT Swarm"

[lib]
path = "src/lib.rs"

[[bin]]
name = "swarm-automation-worker"
path = "src/bin/worker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zeroize = "1"
