[package]
name = "eliot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "swarm"
path = "src/main.rs"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dependencies]
clap.workspace = true
eliot-core.workspace = true
eliot-daemon.workspace = true
eliot-plugin.workspace = true
eliot-plugin-codex.workspace = true
eliot-plugin-muse.workspace = true
eliot-plugin-claude.workspace = true
eliot-plugin-opencode.workspace = true
eliot-plugin-antigravity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util.workspace = true
tower-service = "0.3"
reqwest.workspace = true
futures-util.workspace = true
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
