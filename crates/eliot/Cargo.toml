[package]
name = "eliot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "swarm"
path = "src/main.rs"

[[test]]
name = "muse_plugin"
path = "tests/muse_plugin.rs"
harness = false

[[test]]
name = "claude_plugin"
path = "tests/claude_plugin.rs"
harness = false

[[test]]
name = "opencode_plugin"
path = "tests/opencode_plugin.rs"
harness = false

[[test]]
name = "antigravity_plugin"
path = "tests/antigravity_plugin.rs"
harness = false

[[test]]
name = "codex_plugin"
path = "tests/codex_plugin.rs"
harness = false

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dependencies]
clap.workspace = true
eliot-core.workspace = true
eliot-daemon.workspace = true
eliot-plugin.workspace = true
eliot-plugin-codex.workspace = true
eliot-plugin-muse.workspace = true
eliot-plugin-claude.workspace = true
eliot-plugin-opencode.workspace = true
eliot-plugin-antigravity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process"] }
