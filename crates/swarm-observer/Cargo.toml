[package]
name = "swarm-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Optional bounded metadata observer and authenticated readback client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
swarm-telemetry = { path = "../swarm-telemetry" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
]
