[package]
name = "swarm-adapter-opencode"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Standalone OpenCode V2 module adapter for Eliot Swarm"

[[bin]]
name = "swarm-adapter-opencode"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
eventsource-stream = "=0.2.3"
futures-util = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
