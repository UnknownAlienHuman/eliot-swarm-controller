[package]
name = "swarm-bus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Pure bounded event routing and demand lifecycle for the ELIOT Swarm bus"

[lib]
path = "src/lib.rs"

[[bin]]
name = "swarm-bus-dispatcher"
path = "src/bin/dispatcher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
