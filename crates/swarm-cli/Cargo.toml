[package]
name = "swarm-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Thin standalone CLI client for the local Eliot Swarm host"

[[bin]]
name = "swarm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }
