[package]
name = "swarm-adapter-codex"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Attach-only Codex app-server runtime adapter for the Swarm host"

[[bin]]
name = "swarm-codex-adapter"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
