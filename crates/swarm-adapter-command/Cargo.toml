[package]
name = "swarm-adapter-command"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Independent authenticated one-shot Command Code module adapter"

[dependencies]
agent-client-protocol = "3.3.0"
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "swarm-adapter-command"
path = "src/main.rs"
