[package]
name = "swarm-adapter-claude"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Standalone Claude Agent SDK module adapter for Eliot Swarm"

[[bin]]
name = "swarm-adapter-claude"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
