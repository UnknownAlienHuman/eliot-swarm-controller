[package]
name = "swarm-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Demand-driven lifecycle and module-side IPC helpers for Eliot Swarm"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../swarm-client" }
swarm-contracts = { path = "../swarm-contracts" }
swarm-process = { path = "../swarm-process" }
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
