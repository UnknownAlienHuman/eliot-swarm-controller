[package]
name = "swarm-process"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Small platform process ownership primitives for Eliot Swarm"

[dependencies]
serde_json = "=1.0.151"
sha2 = "=0.10.9"
swarm-contracts = { path = "../swarm-contracts" }

[target.'cfg(windows)'.dependencies]
[target.'cfg(windows)'.dependencies.windows-sys]
version = "=0.61.2"
features = [
        "Win32_Foundation",
        "Win32_Globalization",
        "Win32_Security",
        "Win32_Security_Authorization",
        "Win32_System_Threading",
        "Win32_System_JobObjects",
        "Win32_System_IO",
        "Win32_System_Pipes",
        "Win32_Storage_FileSystem",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"
