[package]
name = "swarm-antigravity-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Standalone authenticated Antigravity warm-stream module adapter"

[[bin]]
name = "swarm-antigravity"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
swarm-client = { path = "../../crates/swarm-client" }
swarm-contracts = { path = "../../crates/swarm-contracts" }
swarm-process = { path = "../../crates/swarm-process" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
