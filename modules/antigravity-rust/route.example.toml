
[[routes]]
alias = 'antigravity-rust-example'
runtime = 'antigravity'
module_artifact_id = 'eliot-antigravity.rust-headless.1'
# After registration, module.route.select must name descriptor version '6'.
# Version 6 consumes the Store-produced swarm.task_prompt@1 envelope for
# task.dispatch; it never renders or falls back to a raw Task snapshot.
enabled = false
[routes.native_options]
workspaceRoot = 'C:\\Projects\\YourRepository'
# Optional exact native model override. When omitted, the adapter passes no
# --model flag and the installed harness default applies; the effective model
# is reported as unknown unless the native init stream observes it. When set,
# the value must equal the native init readback exactly, otherwise open fails.
# modelId = '<OPTIONAL_EXACT_NATIVE_MODEL_ID>'
reasoningEffort = 'high'
