manifest_version = "3.5.0"
source_units = ["crates/rmcp", "crates/rmcp-macros"]
license_declaration = "Apache-2.0; workspace.package.license"
revision_resolution = "Resolve exact compatible release and source revision into Cargo.lock during first build; not main at runtime."
execution = "Rust MCP facade over the same application API used by CLI."
retain = ["Required transport and schema features", "Upstream notices"]
qualification_points = ["GM tools discovery", "MCP disconnect does not stop host", "Async operation handles"]
do_not_copy = ["All examples into runtime", "Every optional MCP feature by default"]

[[donors]]
