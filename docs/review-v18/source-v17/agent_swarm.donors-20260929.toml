schema_version = 1
architecture = "ELIOT Swarm Prototype v12"
as_of = "2026-09-29"
status = "design_inventory_not_an_install_lock"
source_downloaded_by_this_revision = false
built_or_runtime_qualified = false

[policy]
reuse_unit = "Complete public package/crate/backend and its dependency closure; no rewrite of a state machine from snippets."
source_layout = "vendor/<donor>; local changes are separate patches"
versioning = "Exact source snapshot and exact launched runtime are different fields."
runtime_default = "Installed native harness and existing authorized account."
installation = "Project/module-local only; no global pip/npm/PATH mutations."
qualification = "Versioned source read is not a successful Windows run."
licensing = "Preserve upstream license, copyright, notices and applicable bundled third-party rules."
activation = "Only one execution backend owns a session binding."

[[donors]]
id = "muse-sdk"
selection = "primary"
module = "runtime.muse"
repository = "https://github.com/meta-models/muse-code-sdk"
revision = "a7c10c5dd3f66be412077d29f9d11111af70317b"
source_units = ["clients/sdk-ts", "clients/msp-ts", "schema/msp"]
package = "@muse-code/sdk"
manifest_version = "1.3.0"
published_artifact_version_verified = false
license_declaration = "MIT; clients/sdk-ts/package.json"
execution = "Isolated Node SDK bridge; native muse serve owns model execution."
upstream_runtime_dependency_count = 0
retain = ["Generated wire types", "Protocol fixtures", "Publish provenance", "Upstream notices"]
local_glue = ["Module v1 facade", "Task/binding identity", "Normalized observations", "Native effort readback"]
qualification_points = ["Account billing path", "Max on actual host", "Fresh and resume", "Parent and native children", "View replay/gap", "Goal may start execution"]
do_not_copy = ["Model inference implementation", "Global installation scripts"]

[[donors]]
id = "codex-python-sdk"
selection = "primary_integration_candidate"
module = "runtime.codex"
repository = "https://github.com/openai/codex"
revision = "18194bfd3534ca567d886eac454028dafaa68b6c"
source_units = ["sdk/python"]
package = "openai-codex"
manifest_version = "0.0.0-dev"
published_artifact_version_verified = false
license_declaration = "Apache-2.0; sdk/python/pyproject.toml"
execution = "Module-local Python environment; official client routing; native app-server."
source_dependencies = ["pydantic>=2.12", "packaging>=26.2", "openai-codex-cli-bin==0.153.4"]
retain = ["Generated models", "Reader/router implementation", "Fixtures/tests", "License"]
local_glue = ["Module v1 facade", "Connection/profile identity", "Goal/family observation", "Exact runtime selection"]
qualification_points = ["Owned stdio separately from shared daemon", "Existing auth/home", "Actual server version", "Concurrent requests and server requests", "Turn correlation", "Resume and goal"]
do_not_copy = ["codex-rs/app-server-client into core: pulls core/app-server/executor dependency graph", "Legacy codex_as.py synchronous transport"]
notes = "codex_bin selects the launched executable; it does not remove the matching-binary package dependency. Do not install a dev version by invented registry version."

[[donors]]
