[[external_runtimes]]
id = "vendor-cli"
policy = "Use installed authorized native executors. Their binaries, subscriptions and model access are not covered by donor SDK licenses."
claude_sdk_note = "Official TypeScript Agent SDK README uses Commercial Terms; do not label it a permissive open-source code donor without component-specific license verification."
