schema_version = 1
architecture = "ELIOT Swarm Prototype v18"
as_of = "2026-10-02"
status = "mixed_inventory_not_an_install_lock"
inventory_note = "Mixed inventory, updated by Documentation Program Phase A (2026-10-02). Some units are vendored or installed module-locally, some are adopted external packages, and some are reviewed pattern/research entries with nothing installed. There is no single downloaded/built flag for the whole file: every entry records its reviewed pin, its installed/pinned-in-code pin and its qualification level separately, and this file remains an inventory, not an install lock."
source_downloaded_by_this_revision = "mixed_per_entry_see_installed_pin"
built_or_runtime_qualified = "mixed_per_entry_see_qualification_no_live_qualification_implied"

[policy]
reuse_unit = "Complete public package/crate/backend and its dependency closure; no rewrite of a state machine from snippets."
source_layout = "vendor/<donor>; local changes are separate patches"
versioning = "Exact source snapshot and exact launched runtime are different fields."
runtime_default = "Installed native harness and existing authorized account."
installation = "Project/module-local only; no global pip/npm/PATH mutations."
qualification = "Versioned source read is not a successful Windows run."
licensing = "Preserve upstream license, copyright, notices and applicable bundled third-party rules."
activation = "Only one execution backend owns a session binding."
inventory_fields = "Every entry records adoption_class (adopt|pilot|pattern|research|reject|conditional), reviewed_pin, installed_pin and qualification separately (Documentation Program sections 20 and 23). A reviewed or research pin is not an installed pin; compilation or fixture checks are not live qualification. A license that has not been checked against its primary source is recorded as UNVERIFIED, never guessed."

