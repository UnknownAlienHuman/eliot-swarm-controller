# Copy outside the repository or pass --data-dir explicitly.
# Storage paths are relative to this file; OpenCode native paths must be absolute.
# No vendor is installed or launched.
schema_version = 1
[storage]
data_dir = '../.swarm-controller'
queue_capacity = 256
[ipc]
max_frame_bytes = 1048576
max_connections = 256
max_inflight_per_connection = 8
write_timeout_seconds = 15

# Disabled by default. See modules/muse/README.md for the explicit bridge setup.
# An enabled route alone does not launch a process; a scoped module must connect.
[[routes]]
alias = 'muse-manager'
runtime = 'muse'
module_artifact_id = 'muse-sdk-1.3.0-bridge.6'
enabled = false
[routes.native_options]
workspaceRoot = 'C:\Projects\YourRepository'
modelId = 'muse-spark-1.3-contributor'
reasoningEffort = 'max'
approvalMode = 'allowAll'

# Disabled by default. See modules/claude/README.md for the explicit bridge setup.
# Open prepares rootlessly; first exact Task input adopts the observed session.
[[routes]]
alias = 'claude-manager'
runtime = 'claude'
module_artifact_id = 'claude-agent-sdk-0.3.287-bridge.3'
enabled = false
[routes.native_options]
workspaceRoot = 'C:\Projects\YourRepository'
modelId = 'sonnet'

# Disabled. One owned Antigravity warm CLI process per binding; terminal
# results use explicit local receipts because the CLI exposes no turn ID.
[[routes]]
alias = 'antigravity-manager'
runtime = 'antigravity'
module_artifact_id = 'antigravity-cli-warm-bridge.2'
enabled = false
[routes.native_options]
workspaceRoot = 'C:\Projects\YourRepository'
modelId = 'gemini-3.8-flash-high'
reasoningEffort = 'high'

# Disabled, built-in Rust attach-only route. See modules/opencode/README.md.
# Replace every placeholder, keeping credentials in the private connection file.
[[routes]]
alias = 'opencode-manager'
runtime = 'opencode_v2'
module_artifact_id = 'eliot-opencode-v2.http.1'
enabled = false
[routes.native_options]
service_id = 'my-local-opencode-store'
connection_file = 'C:\SwarmPrivate\opencode-connection.json'
expected_version = 'REPLACE_WITH_EXACT_INSTALLED_VERSION'
directory = 'C:\Projects\YourRepository'
[routes.native_options.model]
id = 'REPLACE_WITH_NATIVE_MODEL_ID'
providerID = 'REPLACE_WITH_NATIVE_PROVIDER_ID'
variant = 'REPLACE_WITH_EXACT_VARIANT'

# Disabled. See modules/command/README.md. The Command Code module exposes
# sessionless batches through the scoped runtime protocol. Enabling this
# route alone does not launch or control anything; native model qualification
# is separate from bridge fixtures.
[[routes]]
alias = 'command-manager'
runtime = 'command'
module_artifact_id = 'command-mod-0.1.0-glue.3'
enabled = false
[routes.native_options]
workspaceRoot = 'C:\Projects\YourRepository'
controlRoot = 'C:\SwarmState\command-runs'
modelId = 'REPLACE_WITH_EXACT_NATIVE_MODEL_ID'

# Disabled. Routed models through an operator-run OpenCodex service
# (modules/opencodex/README.md). Execution stays with the native Codex
# backend (C07): this route only names a routed model id; the OpenCodex
# binding itself (endpoint, expectedVersion, adminTokenEnv,
# lifecycleOwner = external) is a SEPARATE module configuration and is
# NOT part of this route. The operator applies OpenCodex's own client
# integration (Codex config / OPENAI_BASE_URL); ELIOT never writes Codex
# configuration. Honest label for the example below: provider=anthropic,
# adapter=anthropic, authMode=oauth -> billing is the operator's Claude
# subscription via OpenCodex's stored login (tier not reported by
# upstream) — this is NOT the native Claude route and NOT a "Max route";
# the native Max route is modules/claude/ above.
# Attach the .2 scoped bridge to an explicitly operator-owned Codex app-server.
# Provider is its registered native provider ID; model is the Codex-visible ID.
# A slash inside a model ID is not parsed as a provider selection.
[[routes]]
alias = 'codex-opencodex-manager'
runtime = 'codex'
module_artifact_id = 'codex-sdk-18194bf-bridge.2'
enabled = false
[routes.native_options]
modelProvider = 'REPLACE_WITH_REGISTERED_CODEX_PROVIDER_ID'
model = 'REPLACE_WITH_CODEX_VISIBLE_MODEL_ID'
workspaceRoot = 'C:\Projects\YourRepository'

# MCP surfaces are fixed when the stdio session starts. The default is a
# read-only observer bound to the local operator identity. Select local-full
# explicitly for the complete legacy local surface; application role and GM
# epoch checks still apply.
[mcp]
default_profile = 'local-observer'

[mcp.profiles.local-observer]
tool_profile = 'observer'
expected_client_id = 'operator'

[mcp.profiles.local-full]
tool_profile = 'full'
expected_client_id = 'operator'
