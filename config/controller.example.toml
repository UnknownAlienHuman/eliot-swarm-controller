# Copy to <Eliot data directory>/config.toml. This does not replace Codex config.
# The first Codex integration uses the installed executable and existing ChatGPT login.
# Select an exact model and an effort supported by the native model/list response.

[profiles.codex-luna]
harness = "codex"
cmd = "codex"
model = "gpt-6-luna"
effort = "medium"
permissions = "workspace-write"
approval_policy = "never"
pass_env = ["CODEX_HOME"]
# Optional native preset for planning and user questions; sandbox remains separate.
# collaboration_mode = "plan"

# Muse Code session host (per-Agent `muse serve`). Point cmd at the installed
# binary, not the launcher, so the registered PID is the host itself. The
# model id must exist in this account's model/list catalogue; the effort must
# be one of the eight MSP tiers (none, minimal, low, medium, high, xhigh, max,
# ultra) and is applied as the session default and per turn. The optional
# approval mode must be one of the four MSP modes (allowAll, promptUnmatched,
# onRequest, denyUnmatched); when omitted the server default rules.
[profiles.muse]
harness = "muse"
cmd = "C:/Tools/MuseCode/muse-bin-1.4.0-R4161.1.exe"
model = "muse-spark-1.3-contributor"
effort = "medium"
# approval = "promptUnmatched"
