# Copy to <Eliot data directory>/config.toml. This does not replace Codex config.
# The five native adapters are Codex, Claude, OpenCode, Muse and Antigravity.
# Every profile is explicit: one harness, one native executable, one exact model.
# There is no builtin fake profile and no default/fallback profile. Captured
# native-store selectors are frozen at admission and never reselected.
# The first Codex integration uses the installed executable and existing ChatGPT login.
# Select an exact model and an effort supported by the native model/list response.

[profiles.codex-luna]
harness = "codex"
cmd = "codex"
model = "gpt-6-luna"
effort = "medium"
permissions = "workspace-write"
approval_policy = "never"
pass_env = ["CODEX_HOME"]
# Optional native preset for planning and user questions; sandbox remains separate.
# collaboration_mode = "plan"

# Muse Code session host (per-Agent `muse serve`). Point cmd at the installed
# binary, not the launcher, so the registered PID is the host itself. The
# model id must exist in this account's model/list catalogue; the effort must
# be one of the eight MSP tiers (none, minimal, low, medium, high, xhigh, max,
# ultra) and is applied as the session default and per turn. The optional
# approval mode must be one of the four MSP modes (allowAll, promptUnmatched,
# onRequest, denyUnmatched); when omitted the server default rules.
[profiles.muse]
harness = "muse"
cmd = "C:/Tools/MuseCode/muse-bin-1.4.0-R4161.1.exe"
model = "muse-spark-1.3-contributor"
effort = "medium"
# approval = "promptUnmatched"

# Claude Code CLI (per-Agent `claude -p` stream-json). Point cmd at the
# installed native executable, not a wrapper, so stop ends the owned CLI.
# The model id must exist in the initialize models catalogue; Eliot mints
# the session id and each turn uuid. The optional approval is the CLI
# permission-mode vocabulary; unset means the CLI-default posture.
[profiles.claude]
harness = "claude"
cmd = "C:/Users/test/.local/bin/claude.exe"
model = "claude-opus-4-6"
# approval = "plan"

# OpenCode (per-Agent `serve`). Point cmd at the installed native executable,
# not a wrapper. model is the exact provider/model-id string; auth_integration
# is the frozen nonsecret selector naming the one native integration whose
# credential is transferred into the isolated store (no owner global auth edit).
[profiles.opencode-openrouter]
harness = "opencode"
cmd = "C:/Tools/OpenCode/opencode.exe"
model = "openrouter/stealth/crouton-alpha"
auth_integration = "openrouter"

# Antigravity. Point cmd at the installed native executable. mode is one of
# plan, auto or accept-edits; effort/approval/collaboration/permissions presets
# are rejected by this adapter.
[profiles.antigravity]
harness = "antigravity"
cmd = "C:/Tools/Antigravity/antigravity.exe"
model = "antigravity-model"
# mode = "auto"
