# Bundled SQLite build flags (see docs/spec/core.md, Store).
# Memory statistics take one process-wide mutex on every allocation; with
# several threads using SQLite that mutex dominated CPU (eliot-store suite
# at 4 threads: 281 s CPU with it, 68.5 s without). Eliot never reads
# sqlite3_memory_used(), so the statistics are off.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
