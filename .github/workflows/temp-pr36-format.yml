name: Temporary PR36 format fix

on:
  push:
    branches: [task/audit-10-automation-disable]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task/audit-10-automation-disable
          fetch-depth: 0
      - name: Apply exact rustfmt correction
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('crates/swarm-kernel-host/src/store/automation.rs'); s=p.read_text(encoding='utf-8'); old='''    let rows = statement\n        .query_map(params![prefix, upper_bound, MAX_IMPACT_OPERATIONS + 1], |row| {\n            Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?))\n        })?\n'''; new='''    let rows = statement\n        .query_map(\n            params![prefix, upper_bound, MAX_IMPACT_OPERATIONS + 1],\n            |row| Ok((row.get::<_, String>(0)?, row.get::<_, String>(1)?)),\n        )?\n'''; assert s.count(old) == 1; p.write_text(s.replace(old, new), encoding='utf-8')"
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/automation.rs
          git commit -m "style: format automation impact query"
          git push origin HEAD:task/audit-10-automation-disable