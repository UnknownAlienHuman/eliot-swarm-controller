name: Import OpenCode configuration slice
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-opencode-configuration.yml', '.github/import-opencode-configuration/**']
permissions: {contents: write, actions: write}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - shell: bash
        env:
          P: 02a24c40509ee2eb2a7a78ad3b593fe579d95fd9
          H: b11a4b88eb8371531f3de9c88354b2db99a5dea625e1154ac686d2991b6d2551
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$P"
          cat .github/import-opencode-configuration/part-* >/tmp/f.patch
          echo "$H  /tmp/f.patch" | sha256sum -c -
          git apply --check /tmp/f.patch && git apply /tmp/f.patch
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u >/tmp/paths
          diff -u .github/import-opencode-configuration/feature-paths /tmp/paths
          sha256sum -c .github/import-opencode-configuration/feature-sha256
          rm -rf .github/import-opencode-configuration .github/workflows/import-opencode-configuration.yml
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          cargo fmt -p eliot-swarm-controller -- --check
          python - <<'PY'
          import hashlib
          from pathlib import Path
          r=Path('vendor/atlas'); e={}
          for x in (r/'SHA256SUMS').read_text().splitlines():
            d,n=x.split('  ',1); p=r/n
            assert n not in e and p.is_file() and not p.is_symlink()
            assert hashlib.sha256(p.read_bytes()).hexdigest()==d; e[n]=d
          assert {p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file()}==set(e)|{'SHA256SUMS'}
          PY
          cargo clippy --locked --lib --bins --no-deps -- -D warnings
      - shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git add -A && git diff --cached --check
          git commit -m 'feat: apply durable OpenCode instruction entries with exact readback' -m 'Use the complete native backend, exact pre/post readback, one mutation, GET-only reconciliation and bounded digest observations. Formatting, warnings-denied Clippy and Atlas hashes passed; no tests, model calls, dependencies, migrations or permanent workflow changes.'
          git push origin HEAD:main
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/workflows/rust.yml/dispatches -f ref=main
