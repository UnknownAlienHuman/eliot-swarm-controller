name: Temporary OpenCode assistant pagination

on:
  push:
    branches:
      - fix/opencode-assistant-pagination

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/opencode-assistant-pagination
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply pagination repair
        shell: bash
        run: |
          python tools/ci/temp_opencode_pagination.py
          rustfmt +1.98.1 --edition 2024 crates/swarm-adapter-opencode/src/native.rs
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/temp-opencode-pagination.yml tools/ci/temp_opencode_pagination.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-adapter-opencode/src/native.rs
          git diff --cached --check
          git commit -m "fix: finish multi-page OpenCode result scans"
      - name: Minimal changed-line Clippy
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/eliot-opencode-pagination-target"
          python tools/ci/clippy-attribution.py \
            --base 7ab8690d32c8d2554c21e9c90566bd57992a0f52 \
            --head HEAD \
            --target-dir "$target_dir" \
            --packages-json '["swarm-adapter-opencode@0.1.0"]'
      - name: Push qualified commit
        shell: bash
        run: git push origin HEAD:fix/opencode-assistant-pagination
