# One-time transport of the prepared source patch from the development container.
# The resulting commit removes this workflow and all three payload parts.
name: Import prepared Muse recovery code
on:
  push:
    branches: [main]
    paths: ['.github/import-muse/**', '.github/workflows/import-muse-recovery.yml']
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'UnknownAlienHuman/eliot-swarm-controller' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify and apply exact prepared source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = fb4523c058c2584715200fff0cee0adbe0996276
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.github/import-muse')
          encoded = ''.join((root / f'part-{i}.b64').read_text() for i in (1,2,3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '06dc9ed72b1711e9696068c97960c04a3b5591e75dc796da204874fb15565c87', 'source transport mismatch'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm -- .github/import-muse/part-1.b64 .github/import-muse/part-2.b64 .github/import-muse/part-3.b64 .github/workflows/import-muse-recovery.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: guard Muse module ownership and persist explicit session recovery' -m 'Add a non-killing OS-owned module launcher, reuse the existing process-group implementation, and retain pending SDK command identities and outcomes across bridge loss. Verify prior process-group departure outside SQLite before admitting a new bridge boot. Resume only an explicitly requested exact native session; do not replay prompts or invent missing creation evidence. The managed transport uses the pinned public SDK Connection, with no new MSP codec, model loop, dependency or table.' -m 'The one-time source-import workflow and payload remove themselves in this commit. Local Rustfmt, Node syntax and SQL preparation passed. Compilation and runtime qualification follow on the normal read-only CI; no native models or cargo test were run by this import.'
          git push origin HEAD:refs/heads/main
