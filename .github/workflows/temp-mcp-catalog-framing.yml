name: Temporary MCP catalog framing

on:
  push:
    branches:
      - fix/mcp-catalog-input-context

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mcp-catalog-input-context
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Preserve public V1 framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-mcp/src/mcp/catalog.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, found {count}')
              text = text.replace(old, new)

          replace_once(
              "    pub search_terms: &'static [&'static str],\n"
              "    pub required_input_fields: &'static [&'static str],\n"
              "    pub required_context: &'static [&'static str],\n"
              "    pub result_policy: &'static str,\n",
              "    pub search_terms: &'static [&'static str],\n"
              "    pub required_context: &'static [&'static str],\n"
              "    pub result_policy: &'static str,\n",
              'CatalogMatch public shape',
          )
          replace_once(
              "                search_terms: metadata.search_terms,\n"
              "                required_input_fields: metadata.required_input_fields,\n"
              "                required_context: metadata.required_context,\n",
              "                search_terms: metadata.search_terms,\n"
              "                required_context: metadata.required_context,\n",
              'CatalogMatch projection',
          )
          replace_once(
              "    for field in metadata.required_input_fields {\n"
              "        update_field(hasher, field.as_bytes());\n"
              "    }\n"
              "    for context in metadata.required_context {\n",
              "    for context in metadata.required_context {\n",
              'V1 digest framing',
          )
          replace_once(
              "        \"{} {} {} {} {} {} {}\",\n"
              "        metadata.group.as_str(),\n"
              "        metadata.purpose,\n"
              "        metadata.when_to_use,\n"
              "        metadata.search_terms.join(\" \"),\n"
              "        metadata.required_input_fields.join(\" \"),\n"
              "        metadata.required_context.join(\" \"),\n"
              "        metadata.result_policy\n",
              "        \"{} {} {} {} {} {}\",\n"
              "        metadata.group.as_str(),\n"
              "        metadata.purpose,\n"
              "        metadata.when_to_use,\n"
              "        metadata.search_terms.join(\" \"),\n"
              "        metadata.required_context.join(\" \"),\n"
              "        metadata.result_policy\n",
              'search metadata framing',
          )
          path.write_text(text, encoding='utf-8')
          PY
          rustfmt +1.98.1 --edition 2024 crates/swarm-mcp/src/mcp/catalog.rs
      - name: Commit refinement
        shell: bash
        run: |
          git rm .github/workflows/temp-mcp-catalog-framing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-mcp/src/mcp/catalog.rs
          git diff --cached --check
          git commit -m "fix: keep typed catalog fields internal"
      - name: Minimal changed-line Clippy
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/eliot-mcp-catalog-framing-target"
          python tools/ci/clippy-attribution.py \
            --base 363fe159b571e5671c4d0ec4027514f7176ea43f \
            --head HEAD \
            --target-dir "$target_dir" \
            --packages-json '["swarm-mcp@0.1.0"]'
      - name: Push qualified commit
        shell: bash
        run: git push origin HEAD:fix/mcp-catalog-input-context
