name: Antigravity A1b active-doc check

on:
  push:
    branches:
      - impl/antigravity-a1b-20261024

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: impl/antigravity-a1b-20261024
      - name: Repair and validate active A1b documentation
        run: python tools/ci/check-a1b-active-docs.py
      - name: Publish consistency fix
        shell: bash
        run: |
          rm .github/workflows/antigravity-a1b-doc-check.yml
          rm tools/ci/check-a1b-active-docs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs: remove stale Antigravity A1b status"
          git push origin HEAD:impl/antigravity-a1b-20261024
