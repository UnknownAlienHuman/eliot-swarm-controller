name: Temporary participant page follow-up

on:
  push:
    branches:
      - fix/participant-page-scan-cursor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/participant-page-scan-cursor
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Fix retained prefix ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/swarm-kernel-host/src/store/coordination.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  ".filter(|encoded| !encoded.is_empty() && encoded.len() % 2 == 0)",
                  ".filter(|encoded| !encoded.is_empty() && encoded.len().is_multiple_of(2))",
              ),
              ("        None => (prefix, false),", "        None => (prefix.clone(), false),"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination.rs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-participant-page-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/coordination.rs
          git diff --cached --check
          git commit -m "fix: retain participant page scope prefix"
          git push origin HEAD:fix/participant-page-scan-cursor