name: Antigravity A1a regression repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/antigravity-a1a-regression-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair connected Antigravity regression
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/antigravity-a1a-regression-once.py
          rustfmt --edition 2024 crates/swarm-kernel-host/src/store/module_bridge_recovery_tests.rs
          git diff --check

      - name: Run exact connected regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p swarm-kernel-host --lib \
            antigravity_terminal_receipt_is_self_contained_and_keeps_task_unresolved \
            -- --nocapture

      - name: Minimal Store Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p swarm-kernel-host --lib --no-deps -- -D warnings

      - name: Commit repair and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/antigravity-a1a-regression-once.yml
          rm tools/ci/antigravity-a1a-regression-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/swarm-kernel-host/src/store/module_bridge_recovery_tests.rs \
                  .github/workflows/antigravity-a1a-regression-once.yml \
                  tools/ci/antigravity-a1a-regression-once.py
          git commit -m 'test: align Antigravity terminal regression with A1a'
          git push origin HEAD:main
