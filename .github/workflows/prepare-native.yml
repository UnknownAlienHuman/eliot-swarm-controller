name: Publish prepared OpenCode terminal slice
on:
  push:
    branches: ['feat/opencode-terminal-results']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and apply exact prepared patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=8745e3334ed638ff98d09b00909a7b562e081b06
          test "$GITHUB_REF_NAME" = "feat/opencode-terminal-results"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          printf '%s  %s\n' 32f1beae0248910ea48c2d10387d60b138768acbf61396646b86b3e3ecd18b55 .github/import/opencode-terminal-results.patch.gz | sha256sum -c -
          gzip -dc .github/import/opencode-terminal-results.patch.gz > "$RUNNER_TEMP/opencode-terminal-results.patch"
          printf '%s  %s\n' 2d3c230bbc61ff1cffc0143af4ba48f31da3da2078e046e4700cc67bea7ea454 "$RUNNER_TEMP/opencode-terminal-results.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/opencode-terminal-results.patch"
          git apply "$RUNNER_TEMP/opencode-terminal-results.patch"
          test "$(git hash-object .github/workflows/rust.yml)" = b8dbc5881fcd65d483816efe6aa115b273217d54
          test "$(git hash-object src/runtime/opencode_v2.rs)" = 5ff2eec5174556a2df85fc475682a9210b1926fe
          test "$(git hash-object src/runtime/opencode_v2/snapshot.rs)" = 050f6cf99e89903d58fec138cd9817f8cae7d09e
          test "$(git hash-object src/runtime/opencode_v2/transcript.rs)" = c5f2dbc285f49ab102245a1ee14aa465632a88c0
          test "$(git hash-object src/runtime/opencode_v2/tests.rs)" = d43b9b1161b06478bf46968ec9ccd785d6a182c8
          test "$(git hash-object src/store/opencode.rs)" = 997dcf17a7dd2b523919d736e8b9554a099dc719
          test "$(git hash-object src/store/opencode/tests.rs)" = 54ca429e4d091d70f05082b0f2640b516777d093
          test "$(git hash-object src/store/producers.rs)" = 1a1efa0e70b8dcd307cc176ac3fb42f8cea25f8f
          git show "$BASE:.github/workflows/prepare-native.yml" > .github/workflows/prepare-native.yml
          rm .github/import/opencode-terminal-results.patch.gz
          git diff --check
      - name: Pinned Rust checks before publication
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          cargo fmt -p eliot-swarm-controller
          cargo clippy --locked --lib --bins --no-deps -- -D warnings
          cargo test --locked opencode -- --nocapture
      - name: Publish feature commit and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git add -A
          git commit -m 'feat: correlate OpenCode terminal turns and export results' -m 'Read the bounded ordered V2 message timeline and correlate each controller-owned deterministic input with its exact terminal idle message. Retain the real terminal message identity, settle producers only from that proof, and export the canonical projected segment through the existing immutable artifact path.' -m 'Reject ambiguous intervening inputs and changed digest pins. Reconcile pending result reads without replaying native POSTs. Run focused OpenCode protocol and Store fixtures in normal Windows/Linux CI.'
          git push origin "HEAD:${GITHUB_REF_NAME}"
