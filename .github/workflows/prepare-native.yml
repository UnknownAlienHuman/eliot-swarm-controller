name: Prepare native integration inputs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect exact source, toolchain and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          mkdir -p .local/inputs/dependency-inputs
          git archive --format=tar HEAD > .local/inputs/source.tar
          printf '%s\n' "$GITHUB_SHA" > .local/inputs/source-commit.txt
          TOOLCHAIN="$(dirname "$(dirname "$(rustup which rustc)")")"
          tar -C "$TOOLCHAIN" -czf .local/inputs/toolchain.tar.gz bin lib
          cp Cargo.toml Cargo.lock .local/inputs/dependency-inputs/
          cargo vendor --locked --versioned-dirs .local/vendor > .local/inputs/dependency-inputs/vendor-config.toml
          tar -C .local -czf .local/inputs/vendor.tar.gz vendor
          (cd .local/inputs && sha256sum source.tar toolchain.tar.gz vendor.tar.gz dependency-inputs/Cargo.toml dependency-inputs/Cargo.lock > SHA256SUMS)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-development-inputs
          path: .local/inputs/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
