name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned toolchain
        # Keep this version aligned with rust-toolchain.toml.
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Scoped Clippy and compile
        run: cargo clippy --locked -p eliot -p eliot-core -p eliot-store -p eliot-plugin -p eliot-daemon -p eliot-plugin-codex -- -D warnings
      - name: Discovery cursor and store regressions
        run: cargo test --locked -p eliot-plugin-codex discovery::tests
      - name: Native store policy regressions
        run: cargo test --locked -p eliot-plugin-codex native::store_policy::tests
      - name: Opened-file identity regression
        run: cargo test --locked -p eliot-plugin held_handle_survives_rename_and_path_replacement
      - name: Version smoke check
        run: cargo run --locked -p eliot -- --version
      - name: Help smoke check
        run: cargo run --locked -p eliot -- --help
      - name: Windows background daemon capture regression
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'target/debug/eliot.exe'
          $data = Join-Path $env:RUNNER_TEMP ('eliot capture Проба ' + [guid]::NewGuid().ToString('N'))
          $start = [Diagnostics.ProcessStartInfo]::new($cli)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($word in @('--data-dir', ($data + '\'), '--json', 'daemon')) {
            $start.ArgumentList.Add($word)
          }
          $starter = [Diagnostics.Process]::new()
          $starter.StartInfo = $start
          $daemon = $null
          try {
            if (!$starter.Start()) { throw 'Could not start the daemon CLI' }
            $output = $starter.StandardOutput.ReadToEndAsync()
            $errors = $starter.StandardError.ReadToEndAsync()
            if (!$starter.WaitForExit(5000)) { throw 'Daemon CLI did not exit' }
            if (!$output.Wait(5000) -or !$errors.Wait(5000)) {
              throw 'Background daemon retained caller capture pipes'
            }
            if ($starter.ExitCode -ne 0 -or ($output.Result | ConvertFrom-Json).state -ne 'starting') {
              throw 'Daemon CLI did not return its startup result'
            }
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              if (Test-Path -LiteralPath (Join-Path $data 'daemon.json')) { break }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $deadline)
            $info = Get-Content -LiteralPath (Join-Path $data 'daemon.json') -Raw | ConvertFrom-Json
            $daemon = [Diagnostics.Process]::GetProcessById($info.pid)
            $null = $daemon.Handle
            $status = & $cli --data-dir $data --json status | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $status.state -ne 'running') {
              throw 'Background daemon is unavailable'
            }
          } finally {
            if ($null -eq $daemon -and (Test-Path -LiteralPath (Join-Path $data 'daemon.json'))) {
              $info = Get-Content -LiteralPath (Join-Path $data 'daemon.json') -Raw | ConvertFrom-Json
              $daemon = [Diagnostics.Process]::GetProcessById($info.pid)
              $null = $daemon.Handle
            }
            if ($null -ne $daemon -and !$daemon.HasExited) {
              $null = & $cli --data-dir $data --json daemon stop --force
              if (!$daemon.WaitForExit(15000)) { throw 'Owned daemon did not stop' }
            }
          }
          Write-Output 'Windows captured-output daemon startup passed'
          exit 0
      - name: Linux fake discovery, observation and worktree smoke
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          umask 077
          cli="$GITHUB_WORKSPACE/target/debug/eliot"
          smoke_root=$(mktemp -d "$RUNNER_TEMP/eliot-ci.XXXXXX")
          repo="$smoke_root/repo"
          data="$smoke_root/data"
          hooks="$smoke_root/hooks"
          mkdir "$repo" "$data" "$hooks"
          daemon_job=

          fixture_git() {
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              timeout --foreground 10s git -C "$repo" \
              -c core.hooksPath="$hooks" -c core.fsmonitor=false \
              -c user.name=EliotCI -c user.email=ci@example.invalid \
              -c commit.gpgSign=false "$@"
          }
          client() {
            timeout --foreground 30s "$cli" --data-dir "$data" --json "$@"
          }
          daemon_active() {
            local owned_job
            for owned_job in $(jobs -pr) $(jobs -ps); do
              if [[ "$owned_job" == "$daemon_job" ]]; then return 0; fi
            done
            return 1
          }
          wait_owned_daemon() {
            local deadline=$((SECONDS + 20)) status=0
            while daemon_active; do
              if (( SECONDS >= deadline )); then return 1; fi
              sleep 0.2
            done
            wait "$daemon_job" || status=$?
            daemon_job=
            return "$status"
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$daemon_job" ]]; then
              if daemon_active; then client daemon stop --force >/dev/null 2>&1 || true; fi
              if ! wait_owned_daemon; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          fixture_git --version
          fixture_git init --initial-branch=main
          printf 'baseline\n' > "$repo/note.txt"
          fixture_git add -- note.txt
          fixture_git commit -m 'Local worktree smoke fixture'
          base=$(fixture_git rev-parse --verify HEAD)
          "$cli" --data-dir "$data" daemon --foreground \
            </dev/null >"$smoke_root/daemon.log" 2>&1 &
          daemon_job=$!
          ready_deadline=$((SECONDS + 15))
          until timeout --foreground 2s "$cli" --data-dir "$data" --json status >/dev/null 2>&1; do
            daemon_active
            (( SECONDS < ready_deadline ))
            sleep 0.2
          done
          status=$(client status)
          jq -e '.workspace_custody | .scope == "current_host" and .capability == "unix_process_group_degraded" and .exact == false and .orphan_possible == true' <<<"$status" >/dev/null

          discovery_first=$(client discover --profile fake --limit 1)
          jq -e '.harness == "fake" and (.subjects | length) == 1 and .coverage.complete == false' <<<"$discovery_first" >/dev/null
          discovery_scope=$(jq -er '.native_scope' <<<"$discovery_first")
          discovery_cursor=$(jq -er '.next_cursor' <<<"$discovery_first")
          discovery_rest=$(client discover --profile fake --scope "$discovery_scope" --cursor "$discovery_cursor" --limit 2)
          jq -e '(.subjects | length) == 2 and .next_cursor == null and .coverage.complete == true' <<<"$discovery_rest" >/dev/null
          jq -es '([.[].subjects[].native_ref] | unique | length) == 3' <<<"$discovery_first $discovery_rest" >/dev/null
          client status | jq -e '.agents == 0 and .owned_plugins == 0 and .discovery_readers == 0' >/dev/null

          attached=$(client attach --profile fake --harness fake \
            --scope "$discovery_scope" --ref fake-discovered-1)
          observer=$(jq -er '.agent' <<<"$attached")
          attach_command=$(jq -er '.command_id' <<<"$attached")
          attach_deadline=$((SECONDS + 15))
          while true; do
            command=$(client cmd show "$attach_command")
            if jq -e '.state == "applied"' <<<"$command" >/dev/null; then break; fi
            jq -e '.state == "accepted" or .state == "queued" or .state == "dispatched"' <<<"$command" >/dev/null
            (( SECONDS < attach_deadline ))
            sleep 0.1
          done
          observed=$(client show "$observer")
          jq -e '.state == "unknown" and .origin == "external" and .observe_only == true and .own_identity == false and .active_turn == null' <<<"$observed" >/dev/null
          observed_generation=$(jq -er '.generation' <<<"$observed")
          history_first=$(client history "$observer" --generation "$observed_generation" --source native --view turns --limit 1)
          history_cursor=$(jq -er '.next_cursor' <<<"$history_first")
          history_rest=$(client history "$observer" --generation "$observed_generation" --source native --view turns --cursor "$history_cursor" --limit 1)
          jq -es '([.[].entries[].turn_id] | unique | length) == 2 and .[1].next_cursor == null' <<<"$history_first $history_rest" >/dev/null
          observed_results=$(client result "$observer" --generation "$observed_generation" --limit 1)
          jq -e '(.turns | length) == 0' <<<"$observed_results" >/dev/null
          if client send "$observer" forbidden-observe-input >/dev/null 2>&1; then
            exit 1
          fi
          detached=$(client detach "$observer")
          detach_command=$(jq -er '.command_id' <<<"$detached")
          detach_deadline=$((SECONDS + 15))
          while true; do
            command=$(client cmd show "$detach_command")
            if jq -e '.state == "applied"' <<<"$command" >/dev/null; then break; fi
            jq -e '.state == "accepted" or .state == "queued" or .state == "dispatched"' <<<"$command" >/dev/null
            (( SECONDS < detach_deadline ))
            sleep 0.1
          done
          detached_view=$(client show "$observer")
          jq -e '.state == "unknown" and .observe_only == true and .own_identity == false and any(.source_states[]; .source == "observe" and .state == "closed")' <<<"$detached_view" >/dev/null

          turn=$(client launch --profile fake --workspace "$repo" \
            --worktree codex/ci-smoke --base "$base" \
            --timeout-seconds 20 --wait -- ci-worktree-echo)
          jq -e '.state == "completed" and .status == "completed" and .final_text == "ci-worktree-echo"' <<<"$turn" >/dev/null
          agent=$(jq -er '.agent' <<<"$turn")
          generation=$(jq -er '.generation | select(. > 0)' <<<"$turn")
          turn_id=$(jq -er '.turn_id' <<<"$turn")
          result=$(client result "$agent" --generation "$generation" --turn-id "$turn_id" --limit 1)
          jq -e '(.turns | length) == 1 and .turns[0].state == "completed" and .turns[0].final_text == "ci-worktree-echo"' <<<"$result" >/dev/null
          view=$(client show "$agent")
          jq -e '.workspace_phase == "ready" and .branch == "codex/ci-smoke"' <<<"$view" >/dev/null
          worktree=$(jq -er '.workspace' <<<"$view")
          [[ "$worktree" == "$data/worktrees/"* ]]

          client stop "$agent" --generation "$generation" >/dev/null
          stop_deadline=$((SECONDS + 20))
          while true; do
            view=$(timeout --foreground 3s "$cli" --data-dir "$data" --json show "$agent")
            if jq -e --argjson generation "$generation" '.state == "stopped" and .generation == $generation' <<<"$view" >/dev/null; then break; fi
            (( SECONDS < stop_deadline ))
            sleep 0.2
          done
          removed=$(client worktree remove "$agent" --generation "$generation")
          jq -e '.state == "applied"' <<<"$removed" >/dev/null
          [[ ! -e "$worktree" && ! -L "$worktree" ]]
          fixture_git show-ref --verify --quiet refs/heads/codex/ci-smoke
          client daemon stop --drain >/dev/null
          wait_owned_daemon
          printf 'Linux fake worktree smoke passed\n'
