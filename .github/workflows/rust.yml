name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned toolchain
        # Keep this version aligned with rust-toolchain.toml.
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Scoped Clippy and compile
        run: cargo clippy --locked -p eliot -- -D warnings
      - name: Version smoke check
        run: cargo run --locked -p eliot -- --version
      - name: Help smoke check
        run: cargo run --locked -p eliot -- --help
