            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'rust_store_task_prompt_v1_crosses_into_claude_bridge5_offline_helpers' -Expected 1 -ExpectedNames @('rust_store_task_prompt_v1_crosses_into_claude_bridge5_offline_helpers')

            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_backfill_rechecks_repaired_hints_and_ignores_inactive_pending_clients' -Expected 1 -ExpectedNames @('issue99_backfill_rechecks_repaired_hints_and_ignores_inactive_pending_clients')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_peer_find_advances_after_filtered_task_and_global_pages' -Expected 1 -ExpectedNames @('issue99_peer_find_advances_after_filtered_task_and_global_pages')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_exact_contract_lookup_bypasses_unrelated_owner_prefix_cards' -Expected 1 -ExpectedNames @('issue99_exact_contract_lookup_bypasses_unrelated_owner_prefix_cards')

            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'host_module_supervisor::tests::unknown362_identity_failure_and_health_write_failure_survive_restart' -Expected 1 -ExpectedNames @('unknown362_identity_failure_and_health_write_failure_survive_restart')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'oversized_detached_public_preview_cannot_replace_launch_authority' -Expected 1 -ExpectedNames @('oversized_detached_public_preview_cannot_replace_launch_authority')
          } elseif ($env:QUALIFICATION -ceq 'focused-publication') {
            & cargo build --locked --package swarm-forge-worker --bin swarm-forge-worker --target-dir $targetDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $workerName = if ($IsWindows) { 'swarm-forge-worker.exe' } else { 'swarm-forge-worker' }
            $worker = Join-Path (Join-Path $targetDir 'debug') $workerName
            $deps = Join-Path $targetDir 'debug/deps'
            [void][IO.Directory]::CreateDirectory($deps)
