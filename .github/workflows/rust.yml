name: Rust
on:
  push:
    branches: [main]
    paths: ['src/**', 'migrations/**', 'modules/muse/**', 'config/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --lib --bins --no-deps -- -D warnings
      - name: Muse bridge syntax and pinned SDK import
        shell: bash
        run: |
          node --version
          node --check modules/muse/control.mjs
          node --check modules/muse/bridge.mjs
          cd modules/muse
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import { spawnMspConnection, Connection } from "@muse-code/sdk"; if (typeof spawnMspConnection !== "function" || typeof Connection !== "function") throw new Error("SDK export mismatch");'
      - name: Build
        run: cargo build --locked --release --bin swarm
      - name: Record build inputs
        if: always()
        shell: bash
        run: |
          mkdir -p build-info
          printf '%s\n' "$GITHUB_SHA" > build-info/source-commit.txt
          rustc --version > build-info/rustc.txt
          cargo --version > build-info/cargo.txt
          node --version > build-info/node.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: swarm-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            Cargo.lock
            config/
            README.md
            modules/muse/*.mjs
            modules/muse/*.json
            modules/muse/README.md
            build-info/
            target/release/swarm
            target/release/swarm.exe
