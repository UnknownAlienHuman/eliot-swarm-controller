name: Rust
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'migrations/**'
      - 'modules/**'
      - 'vendor/**'
      - 'config/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'Justfile'
      - 'README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '**/build.rs'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Intentionally no path filter: the scoped classifier must see tests/**,
    # tools/**, Justfile, workflow changes, documentation, and newly added paths.
  workflow_dispatch:
    inputs:
      qualification:
        description: Qualification scope
        type: choice
        default: full
        options: [full, focused-recovery, focused-store, focused-publication, focused-isolation, focused-authority-release]
permissions:
  contents: read
jobs:
  scope:
    name: Classify changed paths and package ownership
    if: github.event_name != 'workflow_dispatch' || inputs.qualification == 'full'
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      rust_changed: ${{ steps.classify.outputs.rust_changed }}
      metadata_needed: ${{ steps.classify.outputs.metadata_needed }}
      tests_changed: ${{ steps.classify.outputs.tests_changed }}
      tooling_changed: ${{ steps.classify.outputs.tooling_changed }}
      atlas_changed: ${{ steps.classify.outputs.atlas_changed }}
      product_changed: ${{ steps.classify.outputs.product_changed }}
      changed_paths: ${{ steps.classify.outputs.changed_paths }}
      module_js_files: ${{ steps.classify.outputs.module_js_files }}
      packages: ${{ steps.resolve.outputs.packages_json || '[]' }}
      clippy_packages: ${{ steps.resolve.outputs.clippy_packages_json || '[]' }}
      test_targets: ${{ steps.resolve.outputs.test_targets_json || '[]' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths without Cargo
        id: classify
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage Classify -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned toolchain for metadata only
        if: steps.classify.outputs.metadata_needed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version
      - name: Resolve changed packages and real local reverse dependencies
        id: resolve
        if: steps.classify.outputs.metadata_needed == 'true'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage Resolve -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs-only:
    name: Documentation validation
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.scope.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate changed Markdown and diff whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage ValidateDocs -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  tooling-scope:
    name: Build-recipe and tooling path checks
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.scope.outputs.tooling_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check whitespace and changed tooling syntax/metadata
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage ValidateTooling -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rustfmt attribution classifier self-test
        shell: pwsh
        run: |
          $pass = & ./tools/ci/rustfmt-attribution.ps1 `
            -ChangedPathsJson '["crates/example/src/changed.rs"]' `
            -FormattedPathsJson '["crates/example/src/old.rs"]' | ConvertFrom-Json
          if (@($pass.owned).Count -ne 0 -or @($pass.historical).Count -ne 1) {
            throw 'rustfmt attribution did not isolate historical debt'
          }

          $mixed = & ./tools/ci/rustfmt-attribution.ps1 `
            -ChangedPathsJson '["crates/example/src/changed.rs"]' `
            -FormattedPathsJson '["crates/example/src/changed.rs","crates/example/src/old.rs"]' | ConvertFrom-Json
          if (@($mixed.owned).Count -ne 1 `
              -or $mixed.owned[0] -ne 'crates/example/src/changed.rs' `
              -or @($mixed.historical).Count -ne 1 `
              -or $mixed.historical[0] -ne 'crates/example/src/old.rs') {
            throw 'rustfmt attribution did not classify owned and historical paths'
          }

          $failed = $false
          try {
            & ./tools/ci/rustfmt-attribution.ps1 `
              -ChangedPathsJson '["crates/example/src/changed.rs"]' `
              -FormattedPathsJson '["crates/example/src/changed.rs"]' `
              -FailOnOwned | Out-Null
          } catch {
            $failed = $true
          }
          if (-not $failed) {
            throw 'rustfmt attribution did not fail for an owned changed path'
          }

      - name: Clippy attribution classifier self-test
        shell: bash
        run: python tools/ci/clippy-attribution.py --self-test

  module-syntax:
    name: Changed JavaScript module syntax
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.scope.outputs.module_js_files != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Parse only changed module files
        shell: pwsh
        env:
          MODULE_JS_FILES: ${{ needs.scope.outputs.module_js_files }}
        run: |
          $files = @($env:MODULE_JS_FILES | ConvertFrom-Json)
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  rust-format:
    name: Changed Rust files are rustfmt-clean
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.scope.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pinned rustfmt
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
          rustfmt --version
          cargo --version
      - name: Attribute rustfmt output to changed files
        shell: pwsh
        env:
          PACKAGE_SPECS: ${{ needs.scope.outputs.packages }}
          CHANGED_PATHS: ${{ needs.scope.outputs.changed_paths }}
        run: |
          $packages = @($env:PACKAGE_SPECS | ConvertFrom-Json)
          if ($packages.Count -eq 0) {
            exit 0
          }

          $arguments = @('fmt')
          foreach ($package in $packages) { $arguments += @('--package', [string]$package) }
          $arguments += '--'
          & cargo @arguments
          $formatExit = $LASTEXITCODE

          $formattedPaths = @(& git diff --name-only --)
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff could not inspect rustfmt output'
          }
          $formattedPaths = @(
            $formattedPaths | ForEach-Object { $_.Trim().Replace('\', '/') } | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_)
            } | Sort-Object -Unique
          )

          $formattedJson = ConvertTo-Json -InputObject @($formattedPaths) -Compress
          $attribution = & ./tools/ci/rustfmt-attribution.ps1 `
            -ChangedPathsJson $env:CHANGED_PATHS `
            -FormattedPathsJson $formattedJson | ConvertFrom-Json

          $owned = @($attribution.owned)
          $historical = @($attribution.historical)
          if ($historical.Count -gt 0) {
            Write-Warning ('Existing rustfmt debt outside this diff: ' + ($historical -join ', '))
            if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Existing rustfmt debt outside this diff'
              foreach ($path in $historical) {
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- ``$path``"
              }
            }
          }

          if ($owned.Count -gt 0) {
            foreach ($path in $owned) {
              & git diff -- $path
            }
          }

          & git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'could not restore the ephemeral checkout after rustfmt'
          }
          if ($formatExit -ne 0) {
            exit $formatExit
          }
          if ($owned.Count -gt 0) {
            throw ('rustfmt would change owned diff paths: ' + ($owned -join ', '))
          }

  scoped-rust:
    name: Changed Rust packages (all-target compile, changed-line Clippy, changed integration targets)
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && (needs.scope.outputs.packages != '[]' || needs.scope.outputs.clippy_packages != '[]' || needs.scope.outputs.test_targets != '[]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --no-self-update
          rustc --version
          cargo --version
      - name: Prepare one external target for scoped Cargo jobs
        shell: pwsh
        run: |
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage ValidateTarget -TargetDir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision temporary libclang for rusqlite bindgen
        shell: pwsh
        run: |
          if ($IsWindows) {
            $version = '20.1.8'
            $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "llvm-$version"
            $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
            Invoke-WebRequest -Uri $uri -OutFile $installer
            $expectedHash = '3197846A2B19063687DD56E93E34CD941E3548D907F23A6131571321BDF9FE7B'
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actualHash -cne $expectedHash) { throw 'LLVM installer SHA-256 mismatch.' }
            if (Test-Path -LiteralPath $installDir) { throw 'Temporary LLVM install directory must be fresh.' }
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($process.ExitCode)." }
            $libclangDir = Join-Path $installDir 'bin'
            if (-not (Test-Path -LiteralPath (Join-Path $libclangDir 'libclang.dll'))) {
              throw 'The official LLVM installation did not provide libclang.dll.'
            }
          } else {
            & sudo apt-get update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & sudo apt-get install --yes --no-install-recommends libclang-dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $libclang = Get-ChildItem -Path '/usr/lib/llvm-*/lib/libclang.so' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $libclang) { throw 'The libclang development package did not provide libclang.so.' }
            $libclangDir = $libclang.DirectoryName
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIBCLANG_PATH=$libclangDir" -Encoding utf8
      - name: Compile all targets for changed owned packages
        if: needs.scope.outputs.packages != '[]'
        shell: pwsh
        env:
          PACKAGE_SPECS: ${{ needs.scope.outputs.packages }}
        run: |
          $packages = @($env:PACKAGE_SPECS | ConvertFrom-Json)
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'
          foreach ($package in $packages) {
            $packageSpec = [string]$package
            & cargo check --locked --package $packageSpec --all-targets --target-dir $sharedTargetDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Clippy compiler errors and changed-line warnings
        if: needs.scope.outputs.clippy_packages != '[]'
        shell: pwsh
        env:
          PACKAGE_SPECS: ${{ needs.scope.outputs.clippy_packages }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'
          & python tools/ci/clippy-attribution.py `
            --base $env:BASE_SHA `
            --head $env:HEAD_SHA `
            --target-dir $sharedTargetDir `
            --packages-json $env:PACKAGE_SPECS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run changed integration targets only
        if: needs.scope.outputs.tests_changed == 'true'
        shell: pwsh
        env:
          TEST_TARGETS: ${{ needs.scope.outputs.test_targets }}
        run: |
          $targets = @($env:TEST_TARGETS | ConvertFrom-Json)
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'
          $rootHostTargets = @($targets | Where-Object {
            ([string]$_.package).Split('@')[0] -ceq 'eliot-swarm-controller' -and
            $_.target -cin @('check_probe', 'host_recovery')
          })
          if ($rootHostTargets.Count -gt 0) {
            # The compatibility launcher's tests execute the real host sibling.
            & cargo build --locked --package swarm-kernel-host --bin swarm-kernel-host --target-dir $sharedTargetDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($target in $targets) {
            & cargo test --locked --package $target.package --test $target.target --target-dir $sharedTargetDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  atlas-integrity:
    name: Preserve Atlas donor snapshot
    needs: scope
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.scope.outputs.atlas_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact donor file set and hashes
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          root = Path('vendor/atlas')
          expected = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name not in expected, name
              path = root / name
              assert not path.is_symlink() and path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              expected[name] = digest
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == set(expected) | {'SHA256SUMS'}, 'donor file set changed'

  build:
    name: Full existing qualification (manual only)
    needs: scope
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version
      - name: Provision temporary libclang for rusqlite bindgen
        shell: pwsh
        run: |
          if ($IsWindows) {
            $version = '20.1.8'
            $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "llvm-$version"
            $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
            Invoke-WebRequest -Uri $uri -OutFile $installer
            $expectedHash = '3197846A2B19063687DD56E93E34CD941E3548D907F23A6131571321BDF9FE7B'
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actualHash -cne $expectedHash) { throw 'LLVM installer SHA-256 mismatch.' }
            if (Test-Path -LiteralPath $installDir) { throw 'Temporary LLVM install directory must be fresh.' }
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($process.ExitCode)." }
            $libclangDir = Join-Path $installDir 'bin'
            if (-not (Test-Path -LiteralPath (Join-Path $libclangDir 'libclang.dll'))) {
              throw 'The official LLVM installation did not provide libclang.dll.'
            }
          } else {
            & sudo apt-get update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & sudo apt-get install --yes --no-install-recommends libclang-dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $libclang = Get-ChildItem -Path '/usr/lib/llvm-*/lib/libclang.so' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $libclang) { throw 'The libclang development package did not provide libclang.so.' }
            $libclangDir = $libclang.DirectoryName
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIBCLANG_PATH=$libclangDir" -Encoding utf8
      - name: Format, lint, and test all owned workspace packages from metadata
        shell: pwsh
        run: |
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-full-rust-shared-target'
          if (-not (Test-Path -LiteralPath $sharedTargetDir -PathType Container)) {
            [void][IO.Directory]::CreateDirectory($sharedTargetDir)
          }
          & cargo build --locked --package swarm-kernel-host --bin swarm-kernel-host --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo build --locked --package swarm-supervisor --bin swarm-supervisor --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage FullRust -TargetDir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Atlas donor snapshot
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          root = Path('vendor/atlas')
          expected = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name not in expected, name
              path = root / name
              assert not path.is_symlink() and path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              expected[name] = digest
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == set(expected) | {'SHA256SUMS'}, 'donor file set changed'
      - name: Muse bridge syntax and pinned SDK import
        shell: bash
        run: |
          node --version
          for file in modules/muse/*.mjs; do node --check "$file"; done
          cd modules/muse
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import { spawnMspConnection, Connection } from "@muse-code/sdk"; if (typeof spawnMspConnection !== "function" || typeof Connection !== "function") throw new Error("SDK export mismatch");'
      - name: Claude bridge syntax, pinned SDK import and fixture self-test
        shell: bash
        run: |
          node --version
          for file in modules/claude/*.mjs; do node --check "$file"; done
          cd modules/claude
          npm ci --ignore-scripts --no-audit --no-fund
          node selftest.mjs
      - name: Remaining native module fixture tests (no accounts or model calls)
        shell: bash
        run: |
          node modules/muse/selftest.mjs
          node modules/antigravity/selftest.mjs
          node modules/command/test-glue.mjs
          node modules/command/test-bridge.mjs
          node modules/opencodex/selftest.mjs
      - name: Codex SDK provenance and attach protocol fixtures
        shell: bash
        run: |
          python --version
          python -m pip install --disable-pip-version-check -r modules/codex/requirements.txt
          python modules/codex/verify_vendor.py
          python modules/codex/test_bridge.py
      - name: Pinned OpenCode owner runtime
        id: opencode-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: OpenCode durable owner smoke (offline, no model calls)
        shell: bash
        env:
          ELIOT_OPENCODE_BUN_EXE: ${{ steps.opencode-bun.outputs.bun-path }}
        run: |
          cd modules/opencode
          npm ci --ignore-scripts --no-audit --no-fund
          bun test native-mcp-proof.test.mjs
          node selftest.mjs
      - name: Build
        shell: pwsh
        run: |
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-full-rust-shared-target'
          & pwsh -NoProfile -File tools/ci/package-scope.ps1 -Stage ValidateTarget -TargetDir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo build --locked --release --package swarm-cli --bin swarm --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo build --locked --release --package eliot-swarm-controller --bin swarm-host --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo build --locked --release --package swarm-kernel-host --bin swarm-kernel-host --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo build --locked --release --package swarm-supervisor --bin swarm-supervisor --target-dir $sharedTargetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record build inputs
        if: always()
        shell: bash
        run: |
          mkdir -p build-info
          printf '%s\n' "$GITHUB_SHA" > build-info/source-commit.txt
          git rev-parse HEAD^{tree} > build-info/source-tree.txt
          rustc --version > build-info/rustc.txt
          cargo --version > build-info/cargo.txt
          node --version > build-info/node.txt
          git archive --format=tar HEAD > build-info/source.tar
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: swarm-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            Cargo.lock
            config/
            README.md
            THIRD_PARTY_NOTICES.md
            modules/muse/*.mjs
            modules/muse/*.json
            modules/muse/README.md
            modules/claude/*.mjs
            modules/claude/*.json
            modules/claude/README.md
            modules/*/UPDATE.md
            modules/claude/fixtures/
            modules/opencode/README.md
            modules/opencode/*.mjs
            modules/opencode/package*.json
            vendor/atlas/
            build-info/
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm.exe
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-host
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-host.exe
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-kernel-host
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-kernel-host.exe
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-supervisor
            ${{ runner.temp }}/eliot-full-rust-shared-target/release/swarm-supervisor.exe

  focused:
    name: Focused Rust qualification
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.qualification, 'focused-')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: '1'
      QUALIFICATION: ${{ inputs.qualification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustc --version
          cargo --version
      - name: Record exact source
        shell: pwsh
        run: |
          & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Source: $env:GITHUB_SHA; OS: $env:RUNNER_OS"
      - name: Provision temporary libclang for rusqlite bindgen
        shell: pwsh
        run: |
          if ($IsWindows) {
            $version = '20.1.8'
            $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
            $installDir = Join-Path $env:RUNNER_TEMP "llvm-$version"
            $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
            Invoke-WebRequest -Uri $uri -OutFile $installer
            $expectedHash = '3197846A2B19063687DD56E93E34CD941E3548D907F23A6131571321BDF9FE7B'
            $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
            if ($actualHash -cne $expectedHash) { throw 'LLVM installer SHA-256 mismatch.' }
            if (Test-Path -LiteralPath $installDir) { throw 'Temporary LLVM install directory must be fresh.' }
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "LLVM installer failed with exit code $($process.ExitCode)." }
            $libclangDir = Join-Path $installDir 'bin'
            if (-not (Test-Path -LiteralPath (Join-Path $libclangDir 'libclang.dll'))) {
              throw 'The official LLVM installation did not provide libclang.dll.'
            }
          } else {
            & sudo apt-get update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & sudo apt-get install --yes --no-install-recommends libclang-dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $libclang = Get-ChildItem -Path '/usr/lib/llvm-*/lib/libclang.so' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $libclang) { throw 'The libclang development package did not provide libclang.so.' }
            $libclangDir = $libclang.DirectoryName
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIBCLANG_PATH=$libclangDir" -Encoding utf8
      - name: Run selected focused cohorts and reject empty or miscounted selections
        shell: pwsh
        run: |
          $targetDir = Join-Path $env:RUNNER_TEMP "eliot-$($env:QUALIFICATION)-target"
          function Confirm-FocusedSelection {
            param(
              [string]$Package,
              [string]$Filter,
              [int]$Expected = 0,
              [string[]]$ExpectedNames = @(),
              [switch]$Release
            )
            $listArguments = @('test', '--locked', '--package', $Package, '--lib', '--target-dir', $targetDir, $Filter, '--', '--list')
            if ($Release) { $listArguments = @('test', '--release', '--locked', '--package', $Package, '--lib', '--target-dir', $targetDir, $Filter, '--', '--list') }
            $listing = @(& cargo @listArguments)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $selected = @($listing | Where-Object { $_ -match ': test$' })
            $actualNames = @(
              $selected | ForEach-Object { (($_ -replace ': test$', '') -split '::')[-1] } | Sort-Object -CaseSensitive
            )
            $expectedNames = @($ExpectedNames | Sort-Object -CaseSensitive)
            $namesMismatch = $false
            if ($ExpectedNames.Count -gt 0) {
              $namesMismatch = [string]::Join('|', $actualNames) -cne [string]::Join('|', $expectedNames)
            }
            if ($selected.Count -eq 0 -or ($Expected -gt 0 -and $selected.Count -ne $Expected) -or $namesMismatch) {
              throw ('Unexpected selection for {0}/{1}: selected {2}, expected {3} and exact names [{4}]; got [{5}].' -f $Package, $Filter, $selected.Count, $Expected, [string]::Join(', ', $expectedNames), [string]::Join(', ', $actualNames))
            }
            return $selected
          }
          function Invoke-FocusedCohort {
            param(
              [string]$Package,
              [string]$Filter,
              [int]$Expected = 0,
              [string[]]$ExpectedNames = @(),
              [switch]$Release
            )
            $selected = @(Confirm-FocusedSelection -Package $Package -Filter $Filter -Expected $Expected -ExpectedNames $ExpectedNames -Release:$Release)
            $runArguments = @('test', '--locked', '--package', $Package, '--lib', '--target-dir', $targetDir, $Filter, '--', '--nocapture')
            if ($Release) { $runArguments = @('test', '--release', '--locked', '--package', $Package, '--lib', '--target-dir', $targetDir, $Filter, '--', '--nocapture') }
            & cargo @runArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $selectedNames = @($selected | ForEach-Object { $_ -replace ': test$', '' })
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "PASS: $Package/$Filter; $($selected.Count) listed tests on $env:RUNNER_OS; selected: $([string]::Join(', ', $selectedNames))"
          }
          if ($env:QUALIFICATION -ceq 'focused-recovery') {
            Invoke-FocusedCohort 'swarm-adapter-opencode' 'journal65_parity_tests' 5
            Invoke-FocusedCohort 'swarm-adapter-claude' 'journal65_parity_tests' 4
            Invoke-FocusedCohort 'swarm-process' 'permissions::publication_tests' 9
            Invoke-FocusedCohort 'swarm-kernel-host' 'probe_resolution_reservations_hold_conflicts_until_both_owners_depart' 1
            Invoke-FocusedCohort 'swarm-kernel-host' 'independent_probe_resolution_io_overlaps_and_remains_in_store_custody' 1
          } elseif ($env:QUALIFICATION -ceq 'focused-store') {
            $gmNames = @(
              'gm_epoch_fencing_old_new_unrelated_and_unchanged_conflict',
              'successor_continues_retained_attempt_without_replay',
              'lost_reply_readback_returns_retained_receipt',
              'missing_designation_reports_high_water_and_operator_recovers',
              'malformed_current_designation_recovers_only_by_operator_at_high_water_plus_one',
              'malformed_handover_history_reports_damage_without_grant_or_recovery',
              'damaged_designation_without_high_water_stays_unavailable_not_epoch_one',
              'gm_handover_denies_roles_without_grant',
              'gm_public_projections_expose_no_private_credential_material'
            )
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'gm_public_matrix_tests' -Expected 9 -ExpectedNames $gmNames

            # Root integration must supply this PR64 fixture before dispatch.
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'public_agent_open_rejects_auth_required_with_a_free_root_slot' -Expected 1 -ExpectedNames @('public_agent_open_rejects_auth_required_with_a_free_root_slot')

            $probeOwnerNames = @(
              'probe_owner_fixture_child_entry',
              'retained_probe_owner_install_conflict_keeps_custody_and_allows_independent_resource',
              'late_probe_owner_departure_releases_only_its_checkrunner_resource'
            )
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'probe_owner' -Expected 3 -ExpectedNames $probeOwnerNames
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'failed_probe_retains_owner_drops_resolution_and_holds_only_its_resource' -Expected 1 -ExpectedNames @('failed_probe_retains_owner_drops_resolution_and_holds_only_its_resource')

            node --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'rust_store_task_prompt_v1_crosses_into_claude_bridge5_offline_helpers' -Expected 1 -ExpectedNames @('rust_store_task_prompt_v1_crosses_into_claude_bridge5_offline_helpers')

            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_backfill_rechecks_repaired_hints_and_ignores_inactive_pending_clients' -Expected 1 -ExpectedNames @('issue99_backfill_rechecks_repaired_hints_and_ignores_inactive_pending_clients')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_peer_find_advances_after_filtered_task_and_global_pages' -Expected 1 -ExpectedNames @('issue99_peer_find_advances_after_filtered_task_and_global_pages')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'issue99_exact_contract_lookup_bypasses_unrelated_owner_prefix_cards' -Expected 1 -ExpectedNames @('issue99_exact_contract_lookup_bypasses_unrelated_owner_prefix_cards')

            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'host_module_supervisor::tests::unknown362_identity_failure_and_health_write_failure_survive_restart' -Expected 1 -ExpectedNames @('unknown362_identity_failure_and_health_write_failure_survive_restart')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'oversized_detached_public_preview_cannot_replace_launch_authority' -Expected 1 -ExpectedNames @('oversized_detached_public_preview_cannot_replace_launch_authority')
          } elseif ($env:QUALIFICATION -ceq 'focused-publication') {
            & cargo build --locked --package swarm-forge-worker --bin swarm-forge-worker --target-dir $targetDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $workerName = if ($IsWindows) { 'swarm-forge-worker.exe' } else { 'swarm-forge-worker' }
            $worker = Join-Path (Join-Path $targetDir 'debug') $workerName
            $deps = Join-Path $targetDir 'debug/deps'
            [void][IO.Directory]::CreateDirectory($deps)
            $stagedWorker = Join-Path $deps $workerName
            [IO.File]::Copy($worker, $stagedWorker, $false)
            $workerHash = (Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash
            if ((Get-FileHash -LiteralPath $stagedWorker -Algorithm SHA256).Hash -cne $workerHash) {
              throw 'Staged Forge worker differs from the binary built at the recorded source.'
            }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Forge worker SHA-256: $workerHash"
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'pr60_automation_reconcile_isolation' -Expected 3 -ExpectedNames @(
              'earlier_review_commit_survives_later_publication_quarantine_without_replay',
              'later_publication_commits_after_review_subject_quarantine',
              'work_dispatch_pending_second_item_preserves_and_resumes_tail'
            )
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'stale_gm_publication_is_skipped_when_consumer_resumes' -Expected 1 -ExpectedNames @('stale_gm_publication_is_skipped_when_consumer_resumes')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'unknown_effect_handover_fences_former_gm_and_continues_exact_owner' -Expected 1 -ExpectedNames @('unknown_effect_handover_fences_former_gm_and_continues_exact_owner')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 're_promoted_gm_does_not_make_an_old_queued_epoch_current_again' -Expected 1 -ExpectedNames @('re_promoted_gm_does_not_make_an_old_queued_epoch_current_again')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'attempt_control_requires_current_gm_scope_and_exact_live_attempt' -Expected 1 -ExpectedNames @('attempt_control_requires_current_gm_scope_and_exact_live_attempt')
          } elseif ($env:QUALIFICATION -ceq 'focused-isolation') {
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'legacy_worker_demand_poison_tests' -Expected 4 -ExpectedNames @(
              'legacy_demand_poison_reaches_existing_check_and_launch_isolators',
              'legacy_demand_quarantined_launch_is_stable_and_changed_bytes_reactivate',
              'legacy_demand_corrupt_entry_and_route_activate_only_existing_owners',
              'legacy_demand_valid_bits_and_actual_schema_failure_remain_distinct'
            )
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'store_authenticated_task_list_delta_bounded_gap_tail_recovery' -Expected 1 -ExpectedNames @('store_authenticated_task_list_delta_bounded_gap_tail_recovery')
            Invoke-FocusedCohort -Package 'swarm-script-worker' -Filter 'script_run_canonical_golden_v1_matches_exact_bytes_and_bare_sha256' -Expected 1 -ExpectedNames @('script_run_canonical_golden_v1_matches_exact_bytes_and_bare_sha256')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'worker_readers_quarantine_corrupt_meta_without_poisoning_store' -Expected 1 -ExpectedNames @('worker_readers_quarantine_corrupt_meta_without_poisoning_store')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'assigned_candidate_artifact_is_current_only_and_review_receipts_survive_release' -Expected 1 -ExpectedNames @('assigned_candidate_artifact_is_current_only_and_review_receipts_survive_release')
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'store_authenticated_operation_lists_and_delta_preserve_bounded_gaps_and_cursor_tail' -Expected 1 -ExpectedNames @('store_authenticated_operation_lists_and_delta_preserve_bounded_gaps_and_cursor_tail')
          } elseif ($env:QUALIFICATION -ceq 'focused-authority-release') {
            Invoke-FocusedCohort -Package 'swarm-kernel-host' -Filter 'pr74_remaining' -Expected 3 -ExpectedNames @(
              'pr74_remaining_b_work_dispatch_preserves_preimage_manager_scope_and_slot',
              'pr74_remaining_c_irreducible_minimum_is_rejected_in_release_before_effects',
              'pr74_remaining_d_malformed_retained_history_stays_damaged_at_effect_gate'
            ) -Release
          } else {
            throw "Unsupported focused qualification selector: $env:QUALIFICATION"
          }
