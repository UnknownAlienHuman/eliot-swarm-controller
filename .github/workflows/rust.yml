name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository-pinned toolchain
        run: rustup show
      - name: Formatting
        run: cargo fmt --check
      - name: Scoped Clippy and compile
        run: cargo clippy --locked -p eliot -- -D warnings
      - name: Version smoke check
        run: cargo run --locked -p eliot -- --version
      - name: Help smoke check
        run: cargo run --locked -p eliot -- --help
