name: Temporary install Clippy attribution gate

on:
  push:
    branches:
      - fix/ci-independent-clippy

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ci-independent-clippy
          fetch-depth: 0
      - name: Patch the normal workflow
        shell: bash
        run: |
          git show d9bfe17289122802b70516b2f8300d8d7b8b6c0f:.github/workflows/rust.yml > .github/workflows/rust.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rust.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one workflow replacement, found {count}')
              text = text.replace(old, new)

          replace_once(
              "  module-syntax:\n",
              "      - name: Clippy attribution classifier self-test\n"
              "        shell: bash\n"
              "        run: python tools/ci/clippy-attribution.py --self-test\n\n"
              "  module-syntax:\n",
          )
          replace_once(
              "  scoped-rust:\n"
              "    name: Changed Rust packages (strict Clippy, changed integration targets)\n",
              "  scoped-rust:\n"
              "    name: Changed Rust packages (changed-line Clippy, changed integration targets)\n",
          )
          replace_once(
              "      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n"
              "        with:\n"
              "          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n"
              "      - name: Pinned toolchain\n",
              "      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262\n"
              "        with:\n"
              "          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n"
              "          fetch-depth: 0\n"
              "      - name: Pinned toolchain\n",
          )
          replace_once(
              "      - name: Strict Clippy (selected library/binary packages only)\n"
              "        shell: pwsh\n"
              "        env:\n"
              "          PACKAGE_SPECS: ${{ needs.scope.outputs.clippy_packages }}\n"
              "        run: |\n"
              "          $packages = @($env:PACKAGE_SPECS | ConvertFrom-Json)\n"
              "          if ($packages.Count -gt 0) {\n"
              "            $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'\n"
              "            $arguments = @('clippy', '--locked', '--lib', '--bins', '--no-deps', '--target-dir', $sharedTargetDir)\n"
              "            foreach ($package in $packages) { $arguments += @('--package', [string]$package) }\n"
              "            $arguments += @('--', '-D', 'warnings')\n"
              "            & cargo @arguments\n"
              "            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
              "          }\n",
              "      - name: Clippy compiler errors and changed-line warnings\n"
              "        shell: pwsh\n"
              "        env:\n"
              "          PACKAGE_SPECS: ${{ needs.scope.outputs.clippy_packages }}\n"
              "          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}\n"
              "          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n"
              "        run: |\n"
              "          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'\n"
              "          & python tools/ci/clippy-attribution.py `\n"
              "            --base $env:BASE_SHA `\n"
              "            --head $env:HEAD_SHA `\n"
              "            --target-dir $sharedTargetDir `\n"
              "            --packages-json $env:PACKAGE_SPECS\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit the normal gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rust.yml tools/ci/clippy-attribution.py
          git diff --cached --check
          git commit -m "ci: attribute Clippy warnings to changed Rust lines"
          git push origin HEAD:fix/ci-independent-clippy