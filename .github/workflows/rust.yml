name: Temporary stage Clippy attribution workflow

on:
  push:
    branches:
      - fix/ci-independent-clippy

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ci-independent-clippy
          fetch-depth: 0
      - name: Build and publish the final workflow blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f docs/.clippy-workflow-blob ]]; then
            echo "workflow blob is already staged"
            exit 0
          fi

          git show d9bfe17289122802b70516b2f8300d8d7b8b6c0f:.github/workflows/rust.yml > /tmp/rust-final.yml
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/rust-final.yml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one workflow replacement, found {count}: {old[:60]!r}')
              text = text.replace(old, new)

          replace_once(
              "  module-syntax:\n",
              "      - name: Clippy attribution classifier self-test\n"
              "        shell: bash\n"
              "        run: python tools/ci/clippy-attribution.py --self-test\n\n"
              "  module-syntax:\n",
          )
          replace_once(
              "  scoped-rust:\n"
              "    name: Changed Rust packages (strict Clippy, changed integration targets)\n",
              "  scoped-rust:\n"
              "    name: Changed Rust packages (changed-line Clippy, changed integration targets)\n",
          )

          start = text.index("  scoped-rust:\n")
          end = text.index("\n  atlas-integrity:\n", start)
          section = text[start:end]
          checkout_pattern = re.compile(
              r"(      - uses: actions/checkout@[^\n]+\n"
              r"        with:\n"
              r"          ref: [^\n]+\n)"
          )
          section, count = checkout_pattern.subn(r"\1          fetch-depth: 0\n", section, count=1)
          if count != 1:
              raise SystemExit(f'expected one scoped-rust checkout, found {count}')

          dollar = '$'
          package_expr = dollar + '{{ needs.scope.outputs.clippy_packages }}'
          base_expr = dollar + '{{ github.event.pull_request.base.sha || github.event.before }}'
          head_expr = dollar + '{{ github.event.pull_request.head.sha || github.sha }}'
          replacement = (
              "      - name: Clippy compiler errors and changed-line warnings\n"
              "        shell: pwsh\n"
              "        env:\n"
              f"          PACKAGE_SPECS: {package_expr}\n"
              f"          BASE_SHA: {base_expr}\n"
              f"          HEAD_SHA: {head_expr}\n"
              "        run: |\n"
              "          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-scoped-rust-shared-target'\n"
              "          & python tools/ci/clippy-attribution.py `\n"
              "            --base $env:BASE_SHA `\n"
              "            --head $env:HEAD_SHA `\n"
              "            --target-dir $sharedTargetDir `\n"
              "            --packages-json $env:PACKAGE_SPECS\n"
              "          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
          )
          clippy_pattern = re.compile(
              r"      - name: Strict Clippy \(selected library/binary packages only\)\n"
              r".*?"
              r"(?=      - name: Run changed integration targets only\n)",
              re.DOTALL,
          )
          section, count = clippy_pattern.subn(replacement, section, count=1)
          if count != 1:
              raise SystemExit(f'expected one strict Clippy step, found {count}')
          text = text[:start] + section + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          python tools/ci/clippy-attribution.py --self-test
          payload=$(python - <<'PY'
          import base64
          import json
          from pathlib import Path
          content = base64.b64encode(Path('/tmp/rust-final.yml').read_bytes()).decode('ascii')
          print(json.dumps({'content': content, 'encoding': 'base64'}))
          PY
          )
          blob_sha=$(curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "${payload}" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          test -n "${blob_sha}"
          printf '%s\n' "${blob_sha}" > docs/.clippy-workflow-blob

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.clippy-workflow-blob
          git diff --cached --check
          git commit -m "ci: stage final Clippy workflow blob"
          git push origin HEAD:fix/ci-independent-clippy