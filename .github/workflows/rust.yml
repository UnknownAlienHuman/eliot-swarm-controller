name: Temporary PR 26 compiler cleanup

on:
  push:
    branches:
      - fix/compile-head-40591a2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/compile-head-40591a2
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply exact rustfmt and Clippy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "crates/swarm-adapter-codex/src/module_contract.rs",
              'pub(crate) const GOAL_CONTINUATION_ADMISSION_SCHEMA_ID: &str =\n    "swarm.goal_continuation_admission";',
              'pub(crate) const GOAL_CONTINUATION_ADMISSION_SCHEMA_ID: &str = "swarm.goal_continuation_admission";',
          )
          replace_exact(
              "crates/swarm-kernel-host/src/store/github_effects.rs",
              '    automation::{authorization::{self, GithubProjectionContext}, config::AutomationEntry},',
              '    automation::{\n        authorization::{self, GithubProjectionContext},\n        config::AutomationEntry,\n    },',
          )
          replace_exact(
              "crates/swarm-mcp/src/mcp/task_projection_tests.rs",
              'use crate::mcp::TASK_POLL_INTERVAL_MS;\nuse super::{CancelAction, cancel_action, iso8601_utc, pending_input_requests, project_operation};',
              'use super::{CancelAction, cancel_action, iso8601_utc, pending_input_requests, project_operation};\nuse crate::mcp::TASK_POLL_INTERVAL_MS;',
          )
          replace_exact(
              "crates/swarm-mcp/src/mcp/subscriptions.rs",
              '    if categories\n        .iter()\n        .any(|category| *category == Category::Coordination)\n    {',
              '    if categories.contains(&Category::Coordination) {',
          )
          replace_exact(
              "crates/swarm-mcp/src/mcp/subscriptions.rs",
              '/// The single lagged marker for one overflow episode.\npub fn lagged_notification(subscription_id: &str, gap: &LaggedGap) -> CustomNotification {\n    lagged_notification_with_reads(subscription_id, gap, &RESYNC_READS)\n}\n\n',
              '',
          )
          replace_exact(
              "crates/swarm-automation/src/lib.rs",
              '    let mut identity = identity.clone();',
              '    let identity = identity.clone();',
          )
          PY

          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-adapter-codex/src/module_contract.rs \
            crates/swarm-kernel-host/src/store/github_effects.rs \
            crates/swarm-mcp/src/mcp/task_projection_tests.rs \
            crates/swarm-mcp/src/mcp/subscriptions.rs \
            crates/swarm-automation/src/lib.rs
      - name: Restore normal CI, commit and push
        shell: bash
        run: |
          git checkout bad80f4b0c4eb271db717e29e2f5dbfe0de6c906 -- .github/workflows/rust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/rust.yml \
            crates/swarm-adapter-codex/src/module_contract.rs \
            crates/swarm-kernel-host/src/store/github_effects.rs \
            crates/swarm-mcp/src/mcp/task_projection_tests.rs \
            crates/swarm-mcp/src/mcp/subscriptions.rs \
            crates/swarm-automation/src/lib.rs
          git diff --cached --check
          git commit -m "fix: qualify compiler baseline under strict Clippy"
          git push origin HEAD:fix/compile-head-40591a2