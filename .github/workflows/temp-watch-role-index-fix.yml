name: Temporary role-specific watch index fix

on:
  push:
    branches:
      - fix/watch-role-specific-indexes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/watch-role-specific-indexes
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply role-specific index projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-kernel-host/src/store/coordination_watch.rs')
          text = path.read_text(encoding='utf-8')

          old = (
              '        let scope = scope_from_record(&record)?;\n'
              '        let creator_id = model::text(&record["creator"], "client_id")?;\n'
              '        let watch_kind = model::text(&record, "watch_kind")?;\n'
          )
          new = (
              '        let scope = scope_from_record(&record)?;\n'
              '        let creator_id = model::text(&record["creator"], "client_id")?;\n'
              '        let creator_role = model::text(&record["creator"], "role")?;\n'
              '        let watch_kind = model::text(&record, "watch_kind")?;\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'creator replacement count: {count}')
          text = text.replace(old, new)

          old = (
              '        let notice_key = notice_key(&scope.id, creator_id, now, watch_id);\n'
              '        set_meta(\n'
              '            tx,\n'
              '            &notice_key,\n'
              '            &json!({"watch_id":watch_id,"notification_id":watch_id}),\n'
              '        )?;\n'
              '        set_meta(\n'
              '            tx,\n'
              '            &owner_notice_key(creator_id, now, watch_id),\n'
              '            &json!({\n'
              '                "watch_id":watch_id,\n'
              '                "scope_id":scope.id,\n'
              '                "notice_index_key":notice_key,\n'
              '            }),\n'
              '        )?;\n'
          )
          new = (
              '        let notice_index_key = match creator_role {\n'
              '            "participant" => {\n'
              '                let notice_key = notice_key(&scope.id, creator_id, now, watch_id);\n'
              '                set_meta(\n'
              '                    tx,\n'
              '                    &notice_key,\n'
              '                    &json!({"watch_id":watch_id,"notification_id":watch_id}),\n'
              '                )?;\n'
              '                set_meta(\n'
              '                    tx,\n'
              '                    &owner_notice_key(creator_id, now, watch_id),\n'
              '                    &json!({\n'
              '                        "watch_id":watch_id,\n'
              '                        "scope_id":scope.id,\n'
              '                        "notice_index_key":notice_key,\n'
              '                    }),\n'
              '                )?;\n'
              '                json!(notice_key)\n'
              '            }\n'
              '            "manager" | "operator" => Value::Null,\n'
              '            _ => return Err(damaged("watch creator role is unsupported")),\n'
              '        };\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'index replacement count: {count}')
          text = text.replace(old, new)

          old = '        record["notice_index_key"] = json!(notice_key);\n'
          new = '        record["notice_index_key"] = notice_index_key;\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'record replacement count: {count}')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temp-watch-role-index-fix.yml
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination_watch.rs
      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.1 clippy --locked -p swarm-kernel-host --lib --no-deps
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: write watch notice indexes only for participants"
          git push origin HEAD:fix/watch-role-specific-indexes
