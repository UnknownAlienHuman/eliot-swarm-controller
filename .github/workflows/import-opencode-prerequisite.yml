name: Import OpenCode prerequisite slice
on:
  push:
    branches: [main]
    paths:
      - '.github/import-opencode-prerequisite/**'
      - '.github/workflows/import-opencode-prerequisite.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify transport and materialize exact files
        shell: bash
        env:
          EXPECTED_PARENT: b11a24a6eb6860ec4c06ce2482c082cdbe655a03
          EXPECTED_PAYLOAD_SHA256: 169ca1b006cf7f03a3e1e7ec7370972ad49c3930d1218e87df87fbd8e129e7a3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          STAGING_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$STAGING_SHA" > /tmp/staging-sha

          cat .github/import-opencode-prerequisite/part-* > /tmp/opencode-prerequisite.tar.gz
          printf '%s  %s\n' "$EXPECTED_PAYLOAD_SHA256" /tmp/opencode-prerequisite.tar.gz | sha256sum -c -

          rm -rf /tmp/opencode-prerequisite
          mkdir -p /tmp/opencode-prerequisite
          tar -xzf /tmp/opencode-prerequisite.tar.gz -C /tmp/opencode-prerequisite --no-same-owner --no-same-permissions
          test -z "$(find /tmp/opencode-prerequisite -type l -print -quit)"
          test -z "$(find /tmp/opencode-prerequisite ! -type f ! -type d -print -quit)"

          cat > /tmp/expected-product-paths <<'EOF'
README.md
modules/opencode/README.md
modules/opencode/send-after-configuration.example.json
src/model.rs
src/runtime/opencode_v2/configuration.rs
src/store/mod.rs
src/store/operations.rs
src/store/prerequisites.rs
src/store/runtime.rs
          EOF
          find /tmp/opencode-prerequisite -type f -printf '%P\n' | sort > /tmp/actual-product-paths
          diff -u /tmp/expected-product-paths /tmp/actual-product-paths

          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/opencode-prerequisite/$path" "$path"
          done < /tmp/expected-product-paths

          cat > /tmp/expected-product-sha256 <<'EOF'
1ecb51fab266bad565c2e4b2300d8e8cb3a50ba881c1b9116343b87e540d8aa0  README.md
eac1cf2949dd7b2c845759ec6f21939c70dec0f71c19f2176018249ac0a9fb6b  modules/opencode/README.md
23d2aa3322d047f62a0354557203148b41c41f97b5e05cbfa1aac1232cb242ba  modules/opencode/send-after-configuration.example.json
7b6a3cd10cd9dfd299cb49d764c399864b4dc9cebf249568ead2a3e77503c7a5  src/model.rs
1dbfb449af414461440758f31981e524a73c220e0796f4efa90a5b2d9c39b745  src/runtime/opencode_v2/configuration.rs
1bb1737abc47c88f02ec5bf006582dd9cd4efd6a41203eeda34f1c20157bff87  src/store/mod.rs
ed05cda2343bd1b296a48dffcad3b081c261a24b284652db65b64cf594fb6bfc  src/store/operations.rs
8064e197e6c4a9bf2fcba05404b0a4e23048cfe73c7c63f9d4b5f5e25039c275  src/store/prerequisites.rs
52545ce8f20c7e139dc83ffe1c7235a3a70064266e7c3d9bdb5c1acd9f171ad1  src/store/runtime.rs
          EOF
          sha256sum -c /tmp/expected-product-sha256
          git diff --check
      - name: Pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustc --version
          cargo --version
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -p eliot-swarm-controller
          cargo fmt -p eliot-swarm-controller -- --check
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual-product-diff
          diff -u /tmp/expected-product-paths /tmp/actual-product-diff
          while IFS= read -r path; do sha256sum "$path"; done < /tmp/expected-product-paths > /tmp/formatted-product-sha256
      - name: Verify Atlas donor snapshot
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          root = Path('vendor/atlas')
          expected = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name not in expected, name
              path = root / name
              assert not path.is_symlink() and path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              expected[name] = digest
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == set(expected) | {'SHA256SUMS'}, 'donor file set changed'
      - name: Clippy
        run: cargo clippy --locked --lib --bins --no-deps -- -D warnings
      - name: Publish checked source to main
        shell: bash
        run: |
          set -euo pipefail
          STAGING_SHA="$(cat /tmp/staging-sha)"

          rm -rf .github/import-opencode-prerequisite
          rm .github/workflows/import-opencode-prerequisite.yml
          git add -A
          git diff --cached --check

          cat > /tmp/expected-staged-paths <<'EOF'
.github/import-opencode-prerequisite/part-000
.github/import-opencode-prerequisite/part-001
.github/import-opencode-prerequisite/part-002
.github/import-opencode-prerequisite/part-003
.github/import-opencode-prerequisite/part-004
.github/import-opencode-prerequisite/part-005
.github/import-opencode-prerequisite/part-006
.github/workflows/import-opencode-prerequisite.yml
README.md
modules/opencode/README.md
modules/opencode/send-after-configuration.example.json
src/model.rs
src/runtime/opencode_v2/configuration.rs
src/store/mod.rs
src/store/operations.rs
src/store/prerequisites.rs
src/store/runtime.rs
          EOF
          git diff --cached --name-only | sort > /tmp/actual-staged-paths
          diff -u /tmp/expected-staged-paths /tmp/actual-staged-paths
          sha256sum -c /tmp/formatted-product-sha256

          git config user.name 'Iurii Lisenkov'
          git config user.email '71514792+UnknownAlienHuman@users.noreply.github.com'
          git commit -m 'feat: gate OpenCode inputs on exact applied configuration evidence' \
            -m 'Persist one earlier same-binding configure prerequisite for another configure, next-turn send or initial Task dispatch. Recheck the typed OperationContract, exact native root/scope, saved key/action/value digest and readback evidence in the queued-to-sending transaction; ACK, unknown, rejection and cancellation never satisfy it.' \
            -m 'Track controller-owned settings revisions, invalidate only the relevant key on an earlier conflicting configure or newer complete native snapshot, and preserve the short prepare-to-input-admission barrier. Replies, readback, stop controls, exact-turn steering policy and other bindings remain independent; no queue-order inference or workflow engine is added.' \
            -m 'Rust 1.98.1 formatting and locked warnings-denied minimal Clippy passed. All 23 Atlas donor files/checksums are unchanged. No tests, model calls, dependencies, migrations, service mutation or permanent workflow changes.'

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$STAGING_SHA"
          git push origin HEAD:main
