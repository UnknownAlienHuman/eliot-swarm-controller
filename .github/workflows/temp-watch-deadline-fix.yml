name: Temporary exact deadline watch fix

on:
  push:
    branches:
      - fix/watch-deadline-expiry-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/watch-deadline-expiry-boundary
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply deadline boundary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-kernel-host/src/store/coordination_watch.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          replace_once(
              '''    if request.expires_at_ms <= now || request.expires_at_ms > max_expiry {
        return Err(Error::invalid(format!(
            "expires_at_ms must be after now and no more than {} days ahead",
            watch::MAX_WATCH_TTL_MS / (24 * 60 * 60 * 1000)
        )));
    }
    let subject_key = subject_key(
''',
              '''    if request.expires_at_ms <= now || request.expires_at_ms > max_expiry {
        return Err(Error::invalid(format!(
            "expires_at_ms must be after now and no more than {} days ahead",
            watch::MAX_WATCH_TTL_MS / (24 * 60 * 60 * 1000)
        )));
    }
    let exact_deadline_ms = if request.watch_kind == "exact_deadline_reached" {
        let deadline = request.address["expected_deadline_ms"]
            .as_i64()
            .ok_or_else(|| Error::invalid("exact deadline watch has no numeric deadline"))?;
        if request.expires_at_ms < deadline {
            return Err(Error::invalid(
                "exact deadline watch cannot expire before its retained deadline",
            ));
        }
        Some(deadline)
    } else {
        None
    };
    let subject_key = subject_key(
''',
          )

          replace_once(
              '''        if existing["state"] == "active"
            && existing["expires_at_ms"].as_i64().unwrap_or_default() > now
        {
            return Ok(create_receipt(&existing, operation_id, true));
        }
''',
              '''        let existing_expires_at_ms =
            existing["expires_at_ms"].as_i64().unwrap_or_default();
        let invalid_deadline_boundary = exact_deadline_ms
            .is_some_and(|deadline| existing_expires_at_ms < deadline);
        if existing["state"] == "active"
            && existing_expires_at_ms > now
            && !invalid_deadline_boundary
        {
            return Ok(create_receipt(&existing, operation_id, true));
        }
''',
          )

          replace_once(
              '''        if record["state"] != "active" {
            tx.execute("DELETE FROM meta WHERE key=?1", [active_key])?;
            continue;
        }
        if record["expires_at_ms"].as_i64().unwrap_or_default() <= now {
            settle_record(tx, &mut record, "expired", now)?;
            expired += 1;
            continue;
        }
        let creator_is_current = if record["watch_kind"] == "operation_terminal" {
''',
              '''        if record["state"] != "active" {
            tx.execute("DELETE FROM meta WHERE key=?1", [active_key])?;
            continue;
        }
        let expires_at_ms = record["expires_at_ms"].as_i64().unwrap_or_default();
        let deadline_boundary = record["watch_kind"] == "exact_deadline_reached";
        if !deadline_boundary && expires_at_ms <= now {
            settle_record(tx, &mut record, "expired", now)?;
            expired += 1;
            continue;
        }
        let creator_is_current = if record["watch_kind"] == "operation_terminal" {
''',
          )

          replace_once(
              '''        let cursor = match event_cursor(tx, &record, now)? {
            EventCursor::Pending => continue,
''',
              '''        let cursor = match event_cursor(tx, &record, now)? {
            EventCursor::Pending => {
                if expires_at_ms <= now {
                    settle_record(tx, &mut record, "expired", now)?;
                    expired += 1;
                }
                continue;
            }
''',
          )

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/temp-watch-deadline-fix.yml
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination_watch.rs
      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.1 clippy --locked -p swarm-kernel-host --lib --no-deps
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve exact deadline watches at expiry boundary"
          git push origin HEAD:fix/watch-deadline-expiry-boundary
