name: Temporary exact deadline watch fix

on:
  push:
    branches:
      - fix/watch-deadline-expiry-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/watch-deadline-expiry-boundary
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply deadline boundary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-kernel-host/src/store/coordination_watch.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          old = (
              '    if request.expires_at_ms <= now || request.expires_at_ms > max_expiry {\n'
              '        return Err(Error::invalid(format!(\n'
              '            "expires_at_ms must be after now and no more than {} days ahead",\n'
              '            watch::MAX_WATCH_TTL_MS / (24 * 60 * 60 * 1000)\n'
              '        )));\n'
              '    }\n'
              '    let subject_key = subject_key(\n'
          )
          new = (
              '    if request.expires_at_ms <= now || request.expires_at_ms > max_expiry {\n'
              '        return Err(Error::invalid(format!(\n'
              '            "expires_at_ms must be after now and no more than {} days ahead",\n'
              '            watch::MAX_WATCH_TTL_MS / (24 * 60 * 60 * 1000)\n'
              '        )));\n'
              '    }\n'
              '    let exact_deadline_ms = if request.watch_kind == "exact_deadline_reached" {\n'
              '        let deadline = request.address["expected_deadline_ms"]\n'
              '            .as_i64()\n'
              '            .ok_or_else(|| Error::invalid("exact deadline watch has no numeric deadline"))?;\n'
              '        if request.expires_at_ms < deadline {\n'
              '            return Err(Error::invalid(\n'
              '                "exact deadline watch cannot expire before its retained deadline",\n'
              '            ));\n'
              '        }\n'
              '        Some(deadline)\n'
              '    } else {\n'
              '        None\n'
              '    };\n'
              '    let subject_key = subject_key(\n'
          )
          replace_once(old, new)

          old = (
              '        if existing["state"] == "active"\n'
              '            && existing["expires_at_ms"].as_i64().unwrap_or_default() > now\n'
              '        {\n'
              '            return Ok(create_receipt(&existing, operation_id, true));\n'
              '        }\n'
          )
          new = (
              '        let existing_expires_at_ms =\n'
              '            existing["expires_at_ms"].as_i64().unwrap_or_default();\n'
              '        let invalid_deadline_boundary = exact_deadline_ms\n'
              '            .is_some_and(|deadline| existing_expires_at_ms < deadline);\n'
              '        if existing["state"] == "active"\n'
              '            && existing_expires_at_ms > now\n'
              '            && !invalid_deadline_boundary\n'
              '        {\n'
              '            return Ok(create_receipt(&existing, operation_id, true));\n'
              '        }\n'
          )
          replace_once(old, new)

          old = (
              '        if record["state"] != "active" {\n'
              '            tx.execute("DELETE FROM meta WHERE key=?1", [active_key])?;\n'
              '            continue;\n'
              '        }\n'
              '        if record["expires_at_ms"].as_i64().unwrap_or_default() <= now {\n'
              '            settle_record(tx, &mut record, "expired", now)?;\n'
              '            expired += 1;\n'
              '            continue;\n'
              '        }\n'
              '        let creator_is_current = if record["watch_kind"] == "operation_terminal" {\n'
          )
          new = (
              '        if record["state"] != "active" {\n'
              '            tx.execute("DELETE FROM meta WHERE key=?1", [active_key])?;\n'
              '            continue;\n'
              '        }\n'
              '        let expires_at_ms = record["expires_at_ms"].as_i64().unwrap_or_default();\n'
              '        let deadline_boundary = record["watch_kind"] == "exact_deadline_reached";\n'
              '        if !deadline_boundary && expires_at_ms <= now {\n'
              '            settle_record(tx, &mut record, "expired", now)?;\n'
              '            expired += 1;\n'
              '            continue;\n'
              '        }\n'
              '        let creator_is_current = if record["watch_kind"] == "operation_terminal" {\n'
          )
          replace_once(old, new)

          old = (
              '        let cursor = match event_cursor(tx, &record, now)? {\n'
              '            EventCursor::Pending => continue,\n'
          )
          new = (
              '        let cursor = match event_cursor(tx, &record, now)? {\n'
              '            EventCursor::Pending => {\n'
              '                if expires_at_ms <= now {\n'
              '                    settle_record(tx, &mut record, "expired", now)?;\n'
              '                    expired += 1;\n'
              '                }\n'
              '                continue;\n'
              '            }\n'
          )
          replace_once(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/temp-watch-deadline-fix.yml
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination_watch.rs
      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.1 clippy --locked -p swarm-kernel-host --lib --no-deps
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve exact deadline watches at expiry boundary"
          git push origin HEAD:fix/watch-deadline-expiry-boundary
