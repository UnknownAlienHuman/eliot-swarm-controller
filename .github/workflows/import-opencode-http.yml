name: Recover preserved OpenCode source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-opencode-http.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 66341200dd6317a7ed4dedf628b078d16b3b5c64
          persist-credentials: false
      - name: Archive the preserved source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = f54b9259dbc052c942e089aea95a130166916a01
          mkdir -p "$RUNNER_TEMP/recovered-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/recovered-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/recovered-source/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/recovered-source/source-tree.txt"
          (cd "$RUNNER_TEMP/recovered-source" && sha256sum source.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-opencode-source
          path: ${{ runner.temp }}/recovered-source/
          retention-days: 1
          if-no-files-found: error
