name: Temporary refine exact deadline watch fix

on:
  push:
    branches:
      - fix/watch-deadline-expiry-boundary

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/watch-deadline-expiry-boundary
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Refine historical-record boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-kernel-host/src/store/coordination_watch.rs')
          text = path.read_text(encoding='utf-8')
          old = (
              '        let expires_at_ms = record["expires_at_ms"].as_i64().unwrap_or_default();\n'
              '        let deadline_boundary = record["watch_kind"] == "exact_deadline_reached";\n'
              '        if !deadline_boundary && expires_at_ms <= now {\n'
          )
          new = (
              '        let expires_at_ms = record["expires_at_ms"].as_i64().unwrap_or_default();\n'
              '        let deadline_boundary = record["watch_kind"] == "exact_deadline_reached"\n'
              '            && record["address"]["expected_deadline_ms"]\n'
              '                .as_i64()\n'
              '                .is_some_and(|deadline| expires_at_ms >= deadline);\n'
              '        if !deadline_boundary && expires_at_ms <= now {\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one replacement, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/temp-watch-deadline-refine.yml
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination_watch.rs
      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.1 clippy --locked -p swarm-kernel-host --lib --no-deps
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve invalid historical deadline expiry"
          git push origin HEAD:fix/watch-deadline-expiry-boundary
