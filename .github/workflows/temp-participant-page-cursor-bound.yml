name: Temporary participant cursor bound

on:
  push:
    branches:
      - fix/participant-page-scan-cursor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/participant-page-scan-cursor
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Match public cursor byte bound
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/swarm-kernel-host/src/store/coordination.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              "    let client_id = String::from_utf8(bytes).map_err(|_| {\n"
              "        Error::new(\n"
              "            \"COORDINATION_INDEX_CORRUPT\",\n"
              "            \"participant index key does not encode a UTF-8 client identity\",\n"
              "        )\n"
              "    })?;\n"
              "    if keys::key_component(&client_id) != encoded {\n"
          )
          new = (
              "    let client_id = String::from_utf8(bytes).map_err(|_| {\n"
              "        Error::new(\n"
              "            \"COORDINATION_INDEX_CORRUPT\",\n"
              "            \"participant index key does not encode a UTF-8 client identity\",\n"
              "        )\n"
              "    })?;\n"
              "    if client_id.len() > 256 {\n"
              "        return Err(Error::new(\n"
              "            \"COORDINATION_INDEX_CORRUPT\",\n"
              "            \"participant index identity cannot be represented by after_client_id\",\n"
              "        ));\n"
              "    }\n"
              "    if keys::key_component(&client_id) != encoded {\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one client decode boundary, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination.rs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-participant-page-cursor-bound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/coordination.rs
          git diff --cached --check
          git commit -m "fix: bound participant page cursors to wire shape"
          git push origin HEAD:fix/participant-page-scan-cursor