name: Temporary coordination context identity patch

on:
  push:
    branches:
      - fix/coordination-context-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/coordination-context-identity
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply verified participant identity context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          coordination_path = Path("crates/swarm-kernel-host/src/store/coordination.rs")
          coordination = coordination_path.read_text(encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, found {count}")
              return text.replace(old, new, 1)

          coordination = replace_once(
              coordination,
              "struct ScopeData {\n    registration: Value,\n",
              "struct ScopeData {\n    client_id: Option<String>,\n    registration: Value,\n",
              "ScopeData verified client identity",
          )
          coordination = replace_once(
              coordination,
              "    Ok(ScopeData {\n        registration,\n        task,\n        attempt,\n        scope_id,\n    })\n",
              "    Ok(ScopeData {\n        client_id: Some(client_id.to_owned()),\n        registration,\n        task,\n        attempt,\n        scope_id,\n    })\n",
              "participant ScopeData constructor",
          )
          coordination = replace_once(
              coordination,
              "    Ok(ScopeData {\n        registration: Value::Null,\n        task,\n        attempt,\n        scope_id: keys::scope_id(task_id, task_revision, attempt_id)?,\n    })\n",
              "    Ok(ScopeData {\n        client_id: None,\n        registration: Value::Null,\n        task,\n        attempt,\n        scope_id: keys::scope_id(task_id, task_revision, attempt_id)?,\n    })\n",
              "manager ScopeData constructor",
          )
          coordination = replace_once(
              coordination,
              "            Ok(Some(scope_projection(&ScopeData {\n                registration: Value::Null,\n                task,\n                attempt,\n                scope_id: keys::scope_id(task_id, task_revision, attempt_id)?,\n            })))\n",
              "            Ok(Some(scope_projection(&ScopeData {\n                client_id: None,\n                registration: Value::Null,\n                task,\n                attempt,\n                scope_id: keys::scope_id(task_id, task_revision, attempt_id)?,\n            })))\n",
              "retained manager ScopeData constructor",
          )

          start = coordination.index("pub(super) fn concilium_participant_scope_for_client(")
          end = coordination.index("/// Validate a manager's current authority", start)
          authority_block = '''pub(super) fn concilium_participant_scope_for_client(
    db: &Connection,
    client_id: &str,
    task_id: &str,
    task_revision: i64,
    attempt_id: &str,
) -> Result<Value> {
    let scope = load_current_scope_for_client(db, client_id)?;
    if scope.task["task_id"] != task_id
        || scope.task["revision"] != task_revision
        || scope.attempt["attempt_id"] != attempt_id
    {
        return Err(Error::new(
            "STALE_PARTICIPANT",
            "Concilium participant must hold the exact current Task revision and Attempt",
        ));
    }
    participant_authority_projection(&scope)
}

/// Private exact Participant authority used by code-scope and Concilium.
/// Public context projections remain redacted and retain their existing wire shape.
pub(super) fn participant_authority_scope(
    db: &Connection,
    principal: &Principal,
) -> Result<Value> {
    principal.require_participant()?;
    let scope = load_current_scope(db, principal)?;
    participant_authority_projection(&scope)
}

/// Resolve a caller's current Participant grant for a Concilium proposal or
/// position write. This helper never returns credential material.
pub(super) fn concilium_current_participant_scope(
    db: &Connection,
    principal: &Principal,
) -> Result<Value> {
    participant_authority_scope(db, principal)
}

/// Concilium identity commits to the verified key/Principal client ID. The
/// stored registration intentionally need not duplicate that ID. Thread uses
/// a different versioned preimage and is not routed through this helper.
pub(super) fn concilium_registration_fingerprint(
    client_id: &str,
    registration: &Value,
) -> Result<String> {
    if client_id.is_empty() {
        return Err(Error::new(
            "STORE_INVARIANT",
            "Participant authority has no verified client identity",
        ));
    }
    if registration.get("client_id").is_some_and(|retained| {
        !retained.is_null() && retained.as_str() != Some(client_id)
    }) {
        return Err(Error::new(
            "STALE_PARTICIPANT",
            "Participant registration client identity differs from its verified key",
        ));
    }
    let authority = json!({
        "client_id":client_id,
        "role":registration.get("role").cloned().unwrap_or(Value::Null),
        "disabled":registration.get("disabled").cloned().unwrap_or(Value::Null),
        "task_id":registration.get("task_id").cloned().unwrap_or(Value::Null),
        "task_revision":registration.get("task_revision").cloned().unwrap_or(Value::Null),
        "attempt_id":registration.get("attempt_id").cloned().unwrap_or(Value::Null),
        "participation_basis":registration.get("participation_basis").cloned().unwrap_or(Value::Null),
        "binding_id":registration.get("binding_id").cloned().unwrap_or(Value::Null),
        "binding_generation":registration.get("binding_generation").cloned().unwrap_or(Value::Null),
    });
    Ok(format!(
        "sha256:{}",
        model::digest(model::canonical(&authority)?.as_bytes())
    ))
}

fn participant_authority_projection(scope: &ScopeData) -> Result<Value> {
    let registration = &scope.registration;
    let client_id = scope.client_id.as_deref().ok_or_else(|| {
        Error::new(
            "STORE_INVARIANT",
            "Participant authority projection requires a verified client identity",
        )
    })?;
    let generation = registration
        .get("binding_generation")
        .cloned()
        .unwrap_or(Value::Null);
    let fingerprint = concilium_registration_fingerprint(client_id, registration)?;
    Ok(json!({
        "actor":{"client_id":client_id,"role":"participant","generation":generation},
        "scope":{
            "scope_id":scope.scope_id,
            "task_id":scope.task["task_id"],
            "task_revision":scope.task["revision"],
            "attempt_id":scope.attempt["attempt_id"],
            "binding_id":registration.get("binding_id").cloned().unwrap_or(Value::Null),
            "binding_generation":generation,
        },
        "participation_basis":registration.get("participation_basis").cloned().unwrap_or(Value::Null),
        "registration_fingerprint":fingerprint,
    }))
}

'''
          coordination = coordination[:start] + authority_block + coordination[end:]
          coordination_path.write_text(coordination, encoding="utf-8")

          concilium_path = Path("crates/swarm-kernel-host/src/store/concilium.rs")
          concilium = concilium_path.read_text(encoding="utf-8")
          concilium = replace_once(
              concilium,
              "    let current_fingerprint = registration_fingerprint(&registration)?;\n",
              "    let current_fingerprint =\n        coordination::concilium_registration_fingerprint(client_id, &registration)?;\n",
              "Concilium retained fingerprint consumer",
          )
          fingerprint_start = concilium.index("fn registration_fingerprint(registration: &Value) -> Result<String> {")
          fingerprint_end = concilium.index("fn resolve_proposal_participants(", fingerprint_start)
          concilium = concilium[:fingerprint_start] + concilium[fingerprint_end:]
          concilium_path.write_text(concilium, encoding="utf-8")

          scopes_path = Path("crates/swarm-kernel-host/src/store/code_scopes.rs")
          scopes = scopes_path.read_text(encoding="utf-8")
          current_scope_call = "coordination::current_scope("
          if scopes.count(current_scope_call) != 3:
              raise SystemExit(
                  f"code-scope current_scope calls: expected three, found {scopes.count(current_scope_call)}"
              )
          scopes = scopes.replace(
              current_scope_call,
              "coordination::participant_authority_scope(",
          )
          scopes = replace_once(
              scopes,
              "    tasks::get_attempt(tx, attempt_id)?;\n    let scope_intent_id = format!(\"cscope-{}\", model::new_id());\n",
              "    let scope_intent_id = format!(\"cscope-{}\", model::new_id());\n",
              "redundant code-scope Attempt reload",
          )
          scopes = replace_once(
              scopes,
              "    let attempt_id = model::text(&record, \"attempt_id\")?.to_owned();\n    coordination::concilium_manager_scope(tx, principal, &task_id, task_revision, &attempt_id)?;\n",
              "    let attempt_id = model::text(&record, \"attempt_id\")?.to_owned();\n    require_current_scope_identity(tx, &record)?;\n    coordination::concilium_manager_scope(tx, principal, &task_id, task_revision, &attempt_id)?;\n",
              "accept current proposer identity",
          )
          owner_start = scopes.index("fn require_exact_scope_owner(")
          owner_end = scopes.index("fn matches_read_terms(", owner_start)
          owner_block = '''fn require_current_scope_identity(db: &Connection, record: &Value) -> Result<()> {
    let client_id = model::text(&record["actor"], "client_id")?;
    let task_id = model::text(record, "task_id")?;
    let task_revision = record["task_revision"]
        .as_i64()
        .ok_or_else(|| damaged("scope record has no Task revision"))?;
    let attempt_id = model::text(record, "attempt_id")?;
    let current = coordination::concilium_participant_scope_for_client(
        db,
        client_id,
        task_id,
        task_revision,
        attempt_id,
    )?;
    if current["actor"] != record["actor"]
        || current["participation_basis"] != record["participation_basis"]
        || current["registration_fingerprint"] != record["registration_fingerprint"]
    {
        return Err(Error::new(
            "STALE_PARTICIPANT",
            "scope owner registration no longer matches the retained exact identity",
        ));
    }
    Ok(())
}

fn require_exact_scope_owner(db: &Connection, principal: &Principal, record: &Value) -> Result<()> {
    principal.require_participant()?;
    if record["actor"]["client_id"] != principal.client_id {
        return Err(Error::new(
            "FORBIDDEN",
            "only the exact code-scope owner or current Manager may release this scope",
        ));
    }
    require_current_scope_identity(db, record)
}

'''
          scopes = scopes[:owner_start] + owner_block + scopes[owner_end:]
          scopes_path.write_text(scopes, encoding="utf-8")
          PY
          rustfmt +1.98.1 --edition 2024 \
