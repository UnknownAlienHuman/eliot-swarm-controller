name: Temporary coordination context identity patch

on:
  push:
    branches:
      - fix/coordination-context-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/coordination-context-identity
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply verified participant identity context
        shell: bash
        run: |
          python tools/ci/temp_coordination_identity_patch.py
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-kernel-host/src/store/coordination.rs \
            crates/swarm-kernel-host/src/store/concilium.rs \
            crates/swarm-kernel-host/src/store/code_scopes.rs
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          git rm \
            .github/workflows/temp-coordination-context-identity.yml \
            tools/ci/temp_coordination_identity_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/swarm-kernel-host/src/store/coordination.rs \
            crates/swarm-kernel-host/src/store/concilium.rs \
            crates/swarm-kernel-host/src/store/code_scopes.rs
          git diff --cached --check
          git commit -m "fix: unify verified participant authority context"
          git push origin HEAD:fix/coordination-context-identity