name: Temporary mailbox delivery identity fix

on:
  push:
    branches:
      - fix/mailbox-delivery-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mailbox-delivery-identity
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply mailbox authority repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mailbox = Path('crates/swarm-kernel-host/src/store/mailbox.rs')
          text = mailbox.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'mailbox replacement count {count}: {old[:90]!r}')
              text = text.replace(old, new)

          replace_once(
              'use serde_json::{Value, json};\n\n',
              'use serde_json::{Value, json};\n\nconst DELIVERY_ID_ALLOCATION_ATTEMPTS: usize = 16;\n\n',
          )
          replace_once('    pub(super) payload_digest: String,\n', '')
          replace_once(
              '/// Admit a typed, versioned payload without changing or reinterpreting its digest.\n'
              '/// Callers validate thread membership and the thread-local reply target first.\n',
              '/// Admit one typed payload and derive its digest at the mailbox authority boundary.\n'
              '/// Callers validate Thread membership; mailbox revalidates reply identity and direction.\n',
          )

          old = (
              '    model::text(&request.payload, "thread_id")?;\n'
              '    validate_sha256_digest(&request.payload_digest)?;\n'
              '    validate_typed_reply(tx, &request)?;\n\n'
              '    let facts = delivery_facts(tx, &request.sender.client_id, request.recipient_id)?;\n'
              '    if request.payload["sender_actor"] != facts.actor\n'
              '        || request.payload["recipient_actor"] != facts.recipient_actor\n'
              '    {\n'
              '        return Err(Error::invalid(\n'
              '            "typed payload actors must match the authenticated parties",\n'
              '        ));\n'
              '    }\n\n'
          )
          new = (
              '    model::text(&request.payload, "thread_id")?;\n'
              '    let facts = delivery_facts(tx, &request.sender.client_id, request.recipient_id)?;\n'
              '    if request.payload["sender_actor"] != facts.actor\n'
              '        || request.payload["recipient_actor"] != facts.recipient_actor\n'
              '    {\n'
              '        return Err(Error::invalid(\n'
              '            "typed payload actors must match the authenticated parties",\n'
              '        ));\n'
              '    }\n'
              '    validate_typed_reply(tx, &request)?;\n'
              '    let payload_digest = format!(\n'
              '        "sha256:{}",\n'
              '        model::digest(model::canonical(&request.payload)?.as_bytes())\n'
              '    );\n\n'
          )
          replace_once(old, new)
          replace_once('                payload_digest: request.payload_digest,\n', '                payload_digest,\n')

          old = (
              'pub(super) fn find_delivery(db: &Connection, delivery_id: &str) -> Result<Option<Value>> {\n'
              '    let operation_id: Option<String> = db\n'
              '        .query_row(\n'
              '            "SELECT operation_id FROM operations \\\n'
              '             WHERE method IN (\'message.send\',\'coordination.message.send\',\'coordination.send\',\'coordination.consult\') \\\n'
              '               AND state=\'settled\' \\\n'
              '               AND json_type(result_json,\'$.delivery_id\')=\'text\' \\\n'
              '               AND length(json_extract(result_json,\'$.delivery_id\'))>0 \\\n'
              '               AND json_extract(result_json,\'$.delivery_id\')=?1",\n'
              '            [delivery_id],\n'
              '            |row| row.get(0),\n'
              '        )\n'
              '        .optional()?;\n'
              '    match operation_id {\n'
              '        Some(id) => Ok(Some(operations::get_operation(db, &id)?)),\n'
              '        None => Ok(None),\n'
              '    }\n'
              '}\n'
          )
          new = (
              'pub(super) fn find_delivery(db: &Connection, delivery_id: &str) -> Result<Option<Value>> {\n'
              '    let mut statement = db.prepare(\n'
              '        "SELECT operation_id FROM operations \\\n'
              '         WHERE method IN (\'message.send\',\'coordination.message.send\',\'coordination.send\',\'coordination.consult\') \\\n'
              '           AND state=\'settled\' \\\n'
              '           AND json_type(result_json,\'$.delivery_id\')=\'text\' \\\n'
              '           AND length(json_extract(result_json,\'$.delivery_id\'))>0 \\\n'
              '           AND json_extract(result_json,\'$.delivery_id\')=?1 \\\n'
              '         ORDER BY operation_id LIMIT 2",\n'
              '    )?;\n'
              '    let mut rows = statement.query([delivery_id])?;\n'
              '    let Some(row) = rows.next()? else {\n'
              '        return Ok(None);\n'
              '    };\n'
              '    let operation_id: String = row.get(0)?;\n'
              '    if rows.next()?.is_some() {\n'
              '        return Err(Error::new(\n'
              '            "MAILBOX_DELIVERY_AMBIGUOUS",\n'
              '            "delivery identity resolves to more than one immutable Operation",\n'
              '        ));\n'
              '    }\n'
              '    Ok(Some(operations::get_operation(db, &operation_id)?))\n'
              '}\n'
          )
          replace_once(old, new)

          replace_once(
              'fn admit_delivery_core(\n    _tx: &Transaction<\'_>,\n',
              'fn admit_delivery_core(\n    tx: &Transaction<\'_>,\n',
          )
          replace_once(
              '    let delivery_id = new_delivery_id(operation_id, distinct_message_id);\n',
              '    let delivery_id = allocate_delivery_id(tx, operation_id, distinct_message_id)?;\n',
          )

          old = (
              'fn new_delivery_id(operation_id: &str, message_id: &str) -> String {\n'
              '    loop {\n'
              '        let delivery_id = model::new_id();\n'
              '        if delivery_id != operation_id && delivery_id != message_id {\n'
              '            return delivery_id;\n'
              '        }\n'
              '    }\n'
              '}\n\n'
              'fn validate_sha256_digest(digest: &str) -> Result<()> {\n'
              '    let hex = digest.strip_prefix("sha256:").unwrap_or(digest);\n'
              '    if hex.len() != 64 || !hex.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n'
              '        return Err(Error::invalid(\n'
              '            "typed mailbox payload_digest must be a SHA-256 digest",\n'
              '        ));\n'
              '    }\n'
              '    Ok(())\n'
              '}\n\n'
          )
          new = (
              'fn allocate_delivery_id(\n'
              '    db: &Connection,\n'
              '    operation_id: &str,\n'
              '    message_id: &str,\n'
              ') -> Result<String> {\n'
              '    for _ in 0..DELIVERY_ID_ALLOCATION_ATTEMPTS {\n'
              '        let delivery_id = model::new_id();\n'
              '        if delivery_id != operation_id\n'
              '            && delivery_id != message_id\n'
              '            && !mailbox_identity_exists(db, &delivery_id)?\n'
              '        {\n'
              '            return Ok(delivery_id);\n'
              '        }\n'
              '    }\n'
              '    Err(Error::new(\n'
              '        "MAILBOX_DELIVERY_ID_EXHAUSTED",\n'
              '        "could not allocate a distinct mailbox delivery identity",\n'
              '    ))\n'
              '}\n\n'
              'fn mailbox_identity_exists(db: &Connection, identity: &str) -> Result<bool> {\n'
              '    let found: Option<i64> = db\n'
              '        .query_row(\n'
              '            "SELECT 1 FROM operations \\\n'
              '             WHERE operation_id=?1 \\\n'
              '                OR (method IN (\'message.send\',\'coordination.message.send\',\'coordination.send\',\'coordination.consult\') \\\n'
              '                    AND state=\'settled\' \\\n'
              '                    AND (json_extract(result_json,\'$.delivery_id\')=?1 \\\n'
              '                         OR json_extract(result_json,\'$.message_id\')=?1)) \\\n'
              '             LIMIT 1",\n'
              '            [identity],\n'
              '            |row| row.get(0),\n'
              '        )\n'
              '        .optional()?;\n'
              '    Ok(found.is_some())\n'
              '}\n\n'
          )
          replace_once(old, new)

          old = (
              '            if prior["method"] != "coordination.message.send"\n'
              '                || prior["result"]["message_id"] != message_id\n'
              '                || prior["result"]["payload"]["thread_id"] != request.payload["thread_id"]\n'
              '            {\n'
          )
          new = (
              '            if prior["method"] != "coordination.message.send"\n'
              '                || prior["result"]["message_id"] != message_id\n'
              '                || prior["result"]["payload"]["thread_id"] != request.payload["thread_id"]\n'
              '                || prior["result"]["sender"].as_str() != Some(request.recipient_id)\n'
              '                || prior["result"]["recipient"].as_str()\n'
              '                    != Some(request.sender.client_id.as_str())\n'
              '            {\n'
          )
          replace_once(old, new)
          mailbox.write_text(text, encoding='utf-8')

          threads = Path('crates/swarm-kernel-host/src/store/coordination_threads.rs')
          text = threads.read_text(encoding='utf-8')
          old = (
              '    let digest = format!(\n'
              '        "sha256:{}",\n'
              '        model::digest(model::canonical(&payload)?.as_bytes())\n'
              '    );\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'thread digest replacement count: {count}')
          text = text.replace(old, '')
          old = '            payload_digest: digest,\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'thread field replacement count: {count}')
          text = text.replace(old, '')
          threads.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/temp-mailbox-identity-fix.yml
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-kernel-host/src/store/mailbox.rs \
            crates/swarm-kernel-host/src/store/coordination_threads.rs
      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.1 clippy --locked -p swarm-kernel-host --lib --no-deps
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: centralize mailbox delivery identity authority"
          git push origin HEAD:fix/mailbox-delivery-identity
