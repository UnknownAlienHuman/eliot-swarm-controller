name: Architecture ratchet

# Храповик архитектуры (docs/swarm/tools/ratchet.py): запрещённые рёбра крейтов,
# часть циклов модулей и структура таблиц автоматов. Без сборки Rust.
# Ошибка сканера или ослабление порогов относительно base SHA — отказ проверки.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Architecture ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read thresholds from base revision
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]
          gh api --header 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/docs/swarm/tools/ratchet.toml?ref=$BASE_SHA" \
            > "$RUNNER_TEMP/swarm-ratchet-baseline.toml"
      - name: Ratchet (deps, scc, check)
        env:
          BASELINE_REQUIRED: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$BASELINE_REQUIRED" == true ]]; then
            args=(--baseline "$RUNNER_TEMP/swarm-ratchet-baseline.toml")
          fi
          python3 -I docs/swarm/tools/ratchet.py "${args[@]}"
