name: Temporary MCP catalog input context

on:
  push:
    branches:
      - fix/mcp-catalog-input-context

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mcp-catalog-input-context
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply catalog slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/ci/temp_mcp_catalog_input_context.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, found {count}")
              return text.replace(old, new)
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "ToolMetadata fields":
                  if count != 2:
                      raise SystemExit(f"{label}: expected two structural matches, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, found {count}")
              return text.replace(old, new)
          '''
          if text.count(old) != 1:
              raise SystemExit('temporary patch helper shape changed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/ci/temp_mcp_catalog_input_context.py
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-mcp/src/mcp/catalog.rs \
            crates/swarm-mcp/src/mcp/catalog_tests.rs
      - name: Commit implementation
        shell: bash
        run: |
          git rm -f .github/workflows/temp-mcp-catalog-input-context.yml tools/ci/temp_mcp_catalog_input_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-mcp/src/mcp/catalog.rs crates/swarm-mcp/src/mcp/catalog_tests.rs
          git diff --cached --check
          git commit -m "fix: type MCP catalog request-field metadata"
      - name: Minimal changed-line Clippy
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/eliot-mcp-catalog-context-target"
          python tools/ci/clippy-attribution.py \
            --base 363fe159b571e5671c4d0ec4027514f7176ea43f \
            --head HEAD \
            --target-dir "$target_dir" \
            --packages-json '["swarm-mcp@0.1.0"]'
      - name: Push qualified commit
        shell: bash
        run: git push origin HEAD:fix/mcp-catalog-input-context
