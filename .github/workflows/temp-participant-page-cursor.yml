name: Temporary participant page cursor patch

on:
  push:
    branches:
      - fix/participant-page-scan-cursor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/participant-page-scan-cursor
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply participant index cursor repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/swarm-kernel-host/src/store/coordination.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn list_participant_page(\n"
          if text.count(marker) != 1:
              raise SystemExit("participant page boundary is not unique")

          helper = "\n".join([
              "fn lower_hex_nibble(byte: u8) -> Option<u8> {",
              "    match byte {",
              "        b'0'..=b'9' => Some(byte - b'0'),",
              "        b'a'..=b'f' => Some(byte - b'a' + 10),",
              "        _ => None,",
              "    }",
              "}",
              "",
              "fn participant_client_id_from_index_key(prefix: &str, key: &str) -> Result<String> {",
              "    let encoded = key",
              "        .strip_prefix(prefix)",
              "        .filter(|encoded| !encoded.is_empty() && encoded.len() % 2 == 0)",
              "        .ok_or_else(|| {",
              "            Error::new(",
              "                \"COORDINATION_INDEX_CORRUPT\",",
              "                \"participant index key is outside its exact scope prefix\",",
              "            )",
              "        })?;",
              "    let mut bytes = Vec::with_capacity(encoded.len() / 2);",
              "    for pair in encoded.as_bytes().chunks_exact(2) {",
              "        let high = lower_hex_nibble(pair[0]).ok_or_else(|| {",
              "            Error::new(",
              "                \"COORDINATION_INDEX_CORRUPT\",",
              "                \"participant index key has a non-canonical client component\",",
              "            )",
              "        })?;",
              "        let low = lower_hex_nibble(pair[1]).ok_or_else(|| {",
              "            Error::new(",
              "                \"COORDINATION_INDEX_CORRUPT\",",
              "                \"participant index key has a non-canonical client component\",",
              "            )",
              "        })?;",
              "        bytes.push((high << 4) | low);",
              "    }",
              "    let client_id = String::from_utf8(bytes).map_err(|_| {",
              "        Error::new(",
              "            \"COORDINATION_INDEX_CORRUPT\",",
              "            \"participant index key does not encode a UTF-8 client identity\",",
              "        )",
              "    })?;",
              "    if keys::key_component(&client_id) != encoded {",
              "        return Err(Error::new(",
              "            \"COORDINATION_INDEX_CORRUPT\",",
              "            \"participant index key is not canonical\",",
              "        ));",
              "    }",
              "    Ok(client_id)",
              "}",
              "",
          ])
          text = text.replace(marker, helper + marker, 1)

          loop_start = text.index("    for (key, raw) in rows.iter().take(scan_limit as usize) {\n")
          loop_end = text.index("    let partial =", loop_start)
          new_loop = "\n".join([
              "    for (key, raw) in rows.iter().take(scan_limit as usize) {",
              "        let indexed_client_id = participant_client_id_from_index_key(&prefix, key)?;",
              "        if let Some(before) = last_scanned.as_ref() {",
              "            cursor_before_extra = Some(before.clone());",
              "        }",
              "        last_scanned = Some(indexed_client_id.clone());",
              "        let record: Value = serde_json::from_str(raw)?;",
              "        let Some(client_id) = record.get(\"client_id\").and_then(Value::as_str) else {",
              "            stale = stale.saturating_add(1);",
              "            continue;",
              "        };",
              "        if client_id != indexed_client_id {",
              "            stale = stale.saturating_add(1);",
              "            continue;",
              "        }",
              "        match load_current_scope_for_client(db, &indexed_client_id) {",
              "            Ok(candidate) if candidate.scope_id == scope.scope_id => {",
              "                let item = json!({",
              "                    \"client_id\": indexed_client_id,",
              "                    \"participant\": public_registration(&candidate.registration),",
              "                });",
              "                if items.len() < limit as usize {",
              "                    items.push(item);",
              "                } else {",
              "                    more_active = true;",
              "                    // Resume before the first unreturned active participant.",
              "                    last_scanned = cursor_before_extra;",
              "                    break;",
              "                }",
              "            }",
              "            Ok(_) => stale = stale.saturating_add(1),",
              "            Err(error)",
              "                if matches!(",
              "                    error.code.as_str(),",
              "                    \"NOT_FOUND\"",
              "                        | \"FORBIDDEN\"",
              "                        | \"UNAUTHORIZED\"",
              "                        | \"STALE_PARTICIPANT\"",
              "                        | \"STALE_REVISION\"",
              "                        | \"PARTICIPANT_NOT_ASSIGNED\"",
              "                ) =>",
              "            {",
              "                stale = stale.saturating_add(1);",
              "            }",
              "            Err(error) => return Err(error),",
              "        }",
              "    }",
              "",
          ])
          text = text[:loop_start] + new_loop + text[loop_end:]

          old_gaps = (
              "        \"gaps\": if stale > 0 { json!([{\"kind\":\"stale_participant_index_entries\",\"count\":stale}]) } else if has_unscanned { json!([{\"kind\":\"participant_page_scan_bound\",\"count\":null}]) } else { json!([]) },\n"
          )
          new_gaps = (
              "        \"gaps\": [\n"
              "            (stale > 0).then(|| json!({\"kind\":\"stale_participant_index_entries\",\"count\":stale})),\n"
              "            has_unscanned.then(|| json!({\"kind\":\"participant_page_scan_bound\",\"count\":null})),\n"
              "        ].into_iter().flatten().collect::<Vec<_>>(),\n"
          )
          if text.count(old_gaps) != 1:
              raise SystemExit("participant gap projection is not unique")
          path.write_text(text.replace(old_gaps, new_gaps, 1), encoding="utf-8")
          PY
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination.rs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-participant-page-cursor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/coordination.rs
          git diff --cached --check
          git commit -m "fix: advance participant pages from verified index keys"
          git push origin HEAD:fix/participant-page-scan-cursor