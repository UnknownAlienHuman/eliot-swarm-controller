name: Apply final Antigravity A1b production slice

on:
  push:
    branches:
      - runtime/antigravity-a1b-20261024

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/antigravity-a1b-20261024
          fetch-depth: 0

      - name: Reuse checked A1b source patch
        shell: bash
        run: |
          git show 44ee3e72ce222e5b282700e0e9108e52128ccfd9:.github/workflows/a1b-verified-apply.yml > /tmp/a1b-verified.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/a1b-verified.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply source patch with exact preconditions'
          start = lines.index(marker)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          script = []
          for line in lines[run_line + 1:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-a1b.sh').write_text('\n'.join(script) + '\n', encoding='utf-8')
          PY
          bash -euo pipefail /tmp/apply-a1b.sh

      - name: Format affected Rust
        run: cargo fmt --all

      - name: Minimal production Clippy
        run: >-
          cargo clippy --locked
          -p swarm-contracts
          -p swarm-antigravity-adapter
          -p swarm-kernel-host
          -- -D warnings

      - name: Commit verified source slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-contracts/src/runtime.rs \
            crates/swarm-kernel-host/src/store/launcher_dispatch.rs \
            crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs \
            modules/antigravity-rust/src/controller.rs \
            modules/antigravity-rust/tests/sequential_retention.rs \
            tools/qualification/New-NativeQualification.ps1 \
            tools/qualification/Test-LaunchDispatchReadiness.ps1
          git diff --cached --check
          git commit -m "refactor(antigravity): remove dispatch refresh proof"
          git push origin HEAD:runtime/antigravity-a1b-20261024
