name: One-shot Antigravity audit repair

on:
  push:
    branches: [main]
    paths: [.github/workflows/zz-one-shot-antigravity-audit.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'UnknownAlienHuman/eliot-swarm-controller'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact source and documentation edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {found}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          exact(
              "modules/antigravity-rust/route.example.toml",
              "# After registration, module.route.select must name descriptor version '5'.\n# Version 5 consumes the Store-produced swarm.task_prompt@1 envelope for",
              "# After registration, module.route.select must name descriptor version '6'.\n# Version 6 consumes the Store-produced swarm.task_prompt@1 envelope for",
          )

          exact(
              "tools/ci/module-package-policy.json",
              '          "artifact_id": "eliot-antigravity.rust-headless.1",\n          "version": "5"',
              '          "artifact_id": "eliot-antigravity.rust-headless.1",\n          "version": "6"',
          )

          exact(
              "tools/qualification/New-NativeQualification.ps1",
              "module_id = 'antigravity'; artifact_id = 'eliot-antigravity.rust-headless.1'; version = '5'; runtime = 'antigravity';",
              "module_id = 'antigravity'; artifact_id = 'eliot-antigravity.rust-headless.1'; version = '6'; runtime = 'antigravity';",
          )

          installer = "tools/modules/Install-ModuleArtifact.ps1"
          exact(installer, "Assert-AntigravityV5DescriptorContract", "Assert-AntigravityV6DescriptorContract", 2)
          exact(installer, ".1 v5 coordinate", ".1 v6 coordinate")
          exact(installer, "$Descriptor.artifact.version -ne '5'", "$Descriptor.artifact.version -ne '6'")
          exact(installer, "Antigravity artifact version 5", "Antigravity artifact version 6", 3)

          implementation = "docs/agent-operations/implementation.md"
          exact(
              implementation,
              "[architecture](architecture.md). Runtime source was rechecked at\n`05b6d05828e4f3a9106c7c726034de714db845e8` on 2026-10-18; later commits in this\nseries change documentation only. [Findings](refactoring.md) preserve evidence;",
              "[architecture](architecture.md). Runtime source and active package tooling were\nrechecked at `aa1029bec41016b2b7f640c07835ad9f193405e4` on 2026-10-18.\n[Findings](refactoring.md) preserve evidence;",
          )
          exact(
              implementation,
              "Use existing private durable file primitives in `swarm-process`; do not add an adapter\ndatabase. Select the first two consumers only after measuring duplicated\ndelivery-only code and confirming that their outer loops can be deleted without\nmoving vendor policy into the shell. Antigravity Rust and the current Command adapter\nare initial candidates; choose the concrete Command profile after source tracing.\nClaude is an alternate. Do not begin in Codex or Muse, whose large native state\nmachines would distort the common boundary.\n",
              "Use existing private durable file primitives in `swarm-process`; do not add an adapter\ndatabase. Antigravity is the first route and initially keeps its exact Store-delivery\noutbox route-local. Move outbox mechanics into `swarm-client` only after a second\ncurrent route uses the same byte-for-byte ownership and both old loops are deleted.\n\nBootstrap has a separate extraction threshold: Antigravity and Claude's contained\n`module_runtime::OwnedBootstrap` are the first two candidates for one common\n`module_owner` reader. Do not use Command to prove either abstraction: its batch/ACP\nprofile ladder, large journal and ACP state machine would pull vendor policy into the\nshell. Do not begin shared extraction in Codex or Muse for the same reason.\n",
          )

          slice_section = r'''#### First executable slice — Antigravity protocol 2

This is the first source slice. It is not a repository-wide contract migration.
Convert one current Antigravity route from Store admission through exact result/readback;
leave other routes on their current protocol until their own finite slice.

**Observable route**

```text
agent.open
    -> native initialize/readiness
    -> one current binding/boot

task.dispatch or agent.send(next_turn)
    -> one serialized native input window
    -> terminal native event or honest unknown
    -> exact Store outcome/result delivery
```

The route supports only `Open`, `Dispatch`, `Send { next_turn }`, `Refresh`,
`Result` and `Reconcile`. Capability absence is the response for reply, configure,
Goal, background, recover and live steer. Do not create empty handlers or schemas.

**Current owners to edit**

- `crates/swarm-contracts/src/module_command.rs` and `runtime.rs`: define only the
  typed action/capability subset consumed by this route; remove the shared
  `AntigravityDispatchSessionProof` family.
- `crates/swarm-kernel-host/src/store/module_handshake.rs` and the current
  `module.next`/outcome/observe/result handlers: select protocol 2 by semantic
  capability and validate the retained Operation, binding, generation and boot.
- `crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs`:
  delete the vendor proof/readiness gate. Dispatch depends on the current ready
  binding, usable boot and declared action, not a refresh-generated proof packet.
- `modules/antigravity-rust/src/main.rs`: keep one sequential controller and replace
  `HostSession`/`flush_reports` transport duplication with the current `ModuleLink`
  boundary.
- `modules/antigravity-rust/src/ipc.rs`: remove the private `ManagerLink` framing and
  `validate_negotiation` descriptor equality.
- `modules/antigravity-rust/src/contract.rs`: remove schema/capability inventory used
  only to echo the installed descriptor.
- `modules/antigravity-rust/src/module_receipt.rs`: replace repeated
  `ModuleReceiptIdentity` with Operation + generation/boot + disposition/native IDs.
- `modules/antigravity-rust/src/controller.rs`: retain native process/turn ownership,
  sequential input association and native readback; do not move them into common code.
- `crates/swarm-process/src/module_owner.rs`: supply the verified binding-scoped
  bootstrap data instead of another Antigravity env/config parser.

**Delivery and uncertainty**

The first route-local outbox uses existing private durable file operations and stores
only exact already-produced `module.outcome`, `module.observe` and `module.result`
envelopes. It is scoped by binding, generation and adapter boot, preserves order per
Operation/result page, reserves capacity for the terminal record of admitted work and
stops pulling commands before exhaustion.

The same live boot drains after Eliot IPC reconnect. A replacement boot never adopts
or transmits predecessor files automatically. Predecessor files are evidence of an
uncertain delivery; adapter-native readback may produce a new current-boot envelope,
but common delivery code cannot choose recovery. The outbox never stores native
intent and never resends a prompt.

One native input window is active at a time. Lost native write/response remains
`unknown` until Antigravity readback classifies it. A terminal native success without
Store acknowledgment is retained for same-boot delivery; it is not converted into a
second native call. Result bytes remain associated with the original Operation and
turn, never with the newest output by time.

**Deletion condition**

The slice is complete only when the v1 Antigravity route has no new bindings and its
replaced descriptor equality, proof DTO/producer/Store validator, private transport,
receipt identity, fixtures and package checks are absent. Concrete unsettled v1
Operations are settled/exported/replaced before their readers are deleted; no generic
v1 converter is added.

**Minimal construction check**

```text
cargo fmt --all -- --check
cargo clippy --locked \
  -p swarm-contracts -p swarm-client -p swarm-process \
  -p swarm-kernel-host -p swarm-antigravity-adapter \
  --lib --bins -- -D warnings
```

Run the connected Antigravity qualification only after this caller-to-result path is
complete. The completion report names behavior, deleted paths, net owned Rust and
PowerShell/glue, exact remaining unsettled operations and any native readback fact
that is still unavailable.

'''
          marker = "### P4 — Native identity first; local effect state only for gaps\n"
          text = Path(implementation).read_text(encoding="utf-8")
          if marker not in text or "First executable slice — Antigravity protocol 2" in text:
              raise SystemExit("implementation slice insertion marker mismatch")
          Path(implementation).write_text(text.replace(marker, slice_section + marker, 1), encoding="utf-8", newline="\n")

          refactoring = "docs/agent-operations/refactoring.md"
          exact(
              refactoring,
              "Source rechecked through `05b6d05828e4f3a9106c7c726034de714db845e8` on\n2026-10-18.",
              "Source and active package tooling rechecked through\n`aa1029bec41016b2b7f640c07835ad9f193405e4` on 2026-10-18.",
          )
          route_trace = r'''## Current route trace: select a small first slice

Antigravity Rust is the smallest current route that can prove protocol 2 vertically.
It has one sequential native input/result window and a bounded capability surface, but
its Eliot transport, exact descriptor negotiation, receipt identity and dispatch
readiness proof are still private duplicates. Its pending receipts, observation and
completed-turn association are process memory, not durable cross-exit recovery.

The retained S2 readback receipt already demonstrates the failure boundary: the native
turn reached terminal success and was correlated to the dispatch Operation while the
Store row remained `outcome_unknown` after the worker exited. The repair is an exact
same-boot Store-delivery outbox plus honest native readback, not prompt replay or a
universal effect journal.

Command is explicitly rejected as the first shared consumer. The current source has a
98,916-byte adapter owner, a 199,925-byte journal and a 304,695-byte ACP implementation,
plus BatchV3/V4/V5 and AcpV1/V2 profiles. Extracting common code from that route would
make its compatibility and recovery policy the framework contract.

Claude's `module_runtime::OwnedBootstrap` is a reasonable second consumer for the
small bootstrap reader only. Its full adapter and journal are too large to prove a
shared delivery outbox. Therefore bootstrap and delivery extraction have independent
two-consumer gates.

Active package tooling also drifted from the current Antigravity descriptor: source
and template use artifact version 6 while the route example, installer narrow
validator, qualification contract and package policy still selected version 5. Those
four active selectors must move together; historical v5 receipts remain immutable.

'''
          marker = "## 1. Why agents could not finish the project\n"
          text = Path(refactoring).read_text(encoding="utf-8")
          if marker not in text or "## Current route trace: select a small first slice" in text:
              raise SystemExit("refactoring insertion marker mismatch")
          Path(refactoring).write_text(text.replace(marker, route_trace + marker, 1), encoding="utf-8", newline="\n")

          status = "docs/implementation-status.md"
          exact(
              status,
              "**Overall: PARTIAL_PROGRESS.** `main` contains the completed CLI ownership reduction\nand the current architecture/implementation preparation. Runtime source has not\nchanged since commit `25a8e3b`; later commits through the source revision studied\nhere changed documentation.",
              "**Overall: PARTIAL_PROGRESS.** `main` contains the completed CLI ownership reduction,\nthe current architecture/implementation program and the active Antigravity v6 tooling\nrepair. Runtime Rust source has not changed since commit `25a8e3b`; protocol 2 remains\nunimplemented.",
          )
          status_section = r'''### Antigravity v6 tooling alignment

Active new-work selectors now agree on `eliot-antigravity.rust-headless.1` version 6:

- the route example selects descriptor v6;
- the installer applies its narrow schema/capability validator to v6 rather than
  silently bypassing the current artifact;
- the native qualification contract requests v6;
- the package build/qualification policy names v6.

Historical v5 receipts and remediation evidence were not rewritten. This is a static
package/qualification coordination repair; no installed binary or native harness was
qualified by the change.

'''
          marker = "## Latest source and donor study\n"
          text = Path(status).read_text(encoding="utf-8")
          if marker not in text or "### Antigravity v6 tooling alignment" in text:
              raise SystemExit("status tooling insertion marker mismatch")
          text = text.replace(marker, status_section + marker, 1)
          text = text.replace(
              "| Bootstrap/hello | Codex, Claude, OpenCode, Muse, Command and Antigravity repeat owner/env/credential parsing and hello equality. | Common bootstrap in `swarm-process`; common authenticated link in `swarm-client`, adopted by two smaller adapters before broad migration. |",
              "| Bootstrap/hello | Codex, Claude, OpenCode, Muse, Command and Antigravity repeat owner/env/credential parsing and hello equality. | Prove one `swarm-process` bootstrap reader with Antigravity and Claude's contained bootstrap; keep vendor launch/session policy outside it. |",
          )
          text = text.replace(
              "| Store delivery | Every adapter has its own outcome/observation/result outbox and reconnect drain. | One exact `DeliveryOutbox` for Store-bound envelopes only. It never replays native input. |",
              "| Store delivery | Antigravity reports and completed-turn association are memory-only; other adapters retain different journals/drains. | First add an exact route-local Antigravity outbox; move mechanics to `swarm-client` only after a second migrated route deletes the same duplicate. It never replays native input. |",
          )
          first_route = r'''### First executable route selected

Antigravity is the first protocol-2 slice: `Open`, `Dispatch`, next-turn `Send`,
`Refresh`, `Result` and `Reconcile` from Store admission through exact outcome/result
readback. The slice deletes the private transport, full descriptor equality,
`ModuleReceiptIdentity` repetition and the shared `AntigravityDispatchSessionProof`
producer/validator gate. Unsupported actions remain absent capabilities.

The planned outbox is same-boot Store delivery only. Replacement boots do not adopt
predecessor files, and uncertain native input is never replayed. Command is excluded
from initial extraction because its batch/ACP profile ladder and large journals would
turn vendor compatibility policy into a common framework. This route is selected and
specified; its Rust implementation is not yet complete.

'''
          marker = "### Donor conclusions\n"
          if marker not in text or "### First executable route selected" in text:
              raise SystemExit("status route insertion marker mismatch")
          Path(status).write_text(text.replace(marker, first_route + marker, 1), encoding="utf-8", newline="\n")
          PY

      - name: Validate edited text surfaces
        shell: bash
        run: |
          python -m json.tool tools/ci/module-package-policy.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          checks = {
              "modules/antigravity-rust/route.example.toml": ["descriptor version '6'", "# Version 6 consumes"],
              "tools/qualification/New-NativeQualification.ps1": ["artifact_id = 'eliot-antigravity.rust-headless.1'; version = '6'"],
              "tools/modules/Install-ModuleArtifact.ps1": ["Assert-AntigravityV6DescriptorContract", "Antigravity artifact version 6"],
              "docs/agent-operations/implementation.md": ["First executable slice — Antigravity protocol 2"],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing {needle}")
          active = "\n".join(Path(p).read_text(encoding="utf-8") for p in [
              "modules/antigravity-rust/route.example.toml",
              "tools/qualification/New-NativeQualification.ps1",
              "tools/ci/module-package-policy.json",
              "tools/modules/Install-ModuleArtifact.ps1",
          ])
          for stale in ["Assert-AntigravityV5DescriptorContract", ".1 v5 coordinate", "Antigravity artifact version 5"]:
              if stale in active:
                  raise SystemExit(f"stale active Antigravity v5 selector: {stale}")
          PY
          pwsh -NoLogo -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/modules/Install-ModuleArtifact.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/qualification/New-NativeQualification.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          git diff --check

      - name: Commit focused repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-one-shot-antigravity-audit.yml
          git add modules/antigravity-rust/route.example.toml \
            tools/ci/module-package-policy.json \
            tools/qualification/New-NativeQualification.ps1 \
            tools/modules/Install-ModuleArtifact.ps1 \
            docs/agent-operations/implementation.md \
            docs/agent-operations/refactoring.md \
            docs/implementation-status.md
          git commit -m 'fix: align Antigravity v6 and pin first protocol slice'
          git push origin HEAD:main
