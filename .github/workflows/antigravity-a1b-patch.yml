name: Antigravity A1b one-shot patch

on:
  push:
    branches:
      - impl/antigravity-a1b-20261024

permissions:
  contents: write

jobs:
  patch-and-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /tmp/eliot-a1b-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: impl/antigravity-a1b-20261024
      - name: Apply A1b source patch
        run: python tools/ci/apply-antigravity-a1b.py
      - name: Format affected packages
        run: >-
          cargo fmt
          --package swarm-contracts
          --package swarm-antigravity-adapter
          --package swarm-kernel-host
      - name: Minimal warnings-denied Clippy
        run: >-
          cargo clippy --locked
          --package swarm-contracts
          --package swarm-antigravity-adapter
          --package swarm-kernel-host
          --lib --bins -- -D warnings
      - name: Publish patch commit
        shell: bash
        run: |
          rm .github/workflows/antigravity-a1b-patch.yml
          rm tools/ci/apply-antigravity-a1b.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "refactor(antigravity): remove dispatch refresh proof gate"
          git push origin HEAD:impl/antigravity-a1b-20261024
