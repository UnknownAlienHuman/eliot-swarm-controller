name: Export OpenCode prerequisite source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-opencode-prerequisite-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Materialize staged source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/import-opencode-prerequisite/part-* > /tmp/opencode-prerequisite.tar.gz
          printf '%s  %s\n' '169ca1b006cf7f03a3e1e7ec7370972ad49c3930d1218e87df87fbd8e129e7a3' /tmp/opencode-prerequisite.tar.gz | sha256sum -c -
          mkdir materialized
          tar -xzf /tmp/opencode-prerequisite.tar.gz -C materialized --no-same-owner --no-same-permissions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-prerequisite-materialized
          retention-days: 1
          if-no-files-found: error
          path: |
            materialized/src/store/prerequisites.rs
            materialized/src/store/runtime.rs
            materialized/src/model.rs
            materialized/src/store/operations.rs
