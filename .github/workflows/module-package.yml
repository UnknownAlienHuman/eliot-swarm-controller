name: Manual module package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Select one exact approved package and its single binary target; host package is release-only.
        type: choice
        options:
          - swarm-adapter-codex
          - swarm-adapter-command
          - swarm-antigravity-adapter
          - swarm-adapter-opencode
          - swarm-process
          - swarm-script-worker
          - swarm-observer
          - swarm-checks
          - swarm-forge-worker
          - swarm-bus
          - eliot-swarm-controller
        required: true
      profile:
        description: Workspace build profile for the selected package.
        type: choice
        options:
          - iterate
          - release
        default: iterate
        required: true
permissions:
  contents: read
jobs:
  package:
    name: Build one selected Windows module package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install the repository-pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = [regex]::Match((Get-Content -Raw rust-toolchain.toml), '(?m)^\s*channel\s*=\s*"([^"]+)"\s*$')
          if (-not $toolchain.Success) { throw 'rust-toolchain.toml has no exact channel.' }
          rustup toolchain install $toolchain.Groups[1].Value --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve one package from Cargo metadata and build only its binaries
        shell: pwsh
        env:
          MODULE_PACKAGE: ${{ inputs.package }}
          MODULE_PROFILE: ${{ inputs.profile }}
        run: |
          $modulePackages = @(
            'swarm-adapter-codex', 'swarm-adapter-command',
            'swarm-antigravity-adapter', 'swarm-adapter-opencode',
            'swarm-process', 'swarm-script-worker', 'swarm-observer',
            'swarm-checks', 'swarm-forge-worker', 'swarm-bus'
          )
          $hostPackage = 'eliot-swarm-controller'
          if ($env:MODULE_PACKAGE -cnotin ($modulePackages + $hostPackage)) {
            throw 'Choose exactly one package from the declared workflow input list.'
          }
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-module-shared-target'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'eliot-module-package'
          if (-not (Test-Path -LiteralPath $sharedTargetDir -PathType Container)) {
            [void][IO.Directory]::CreateDirectory($sharedTargetDir)
          }
          if (Test-Path -LiteralPath $artifactDir) {
            throw 'The selected package output directory must be fresh.'
          }
          if ($env:MODULE_PACKAGE -ceq $hostPackage) {
            if ($env:MODULE_PROFILE -cne 'release') {
              throw 'The host provenance package is release-only.'
            }
            & pwsh -NoProfile -File 'tools/ci/Build-SwarmHostProvenance.ps1' `
              -TargetDir $sharedTargetDir -OutputDir $artifactDir
          }
          else {
            & pwsh -NoProfile -File 'tools/ci/build-module-package.ps1' `
              -Package $env:MODULE_PACKAGE -Profile $env:MODULE_PROFILE `
              -TargetDir $sharedTargetDir -OutputDir $artifactDir
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-${{ inputs.package }}-${{ inputs.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/eliot-module-package/
          if-no-files-found: error
          retention-days: 14
