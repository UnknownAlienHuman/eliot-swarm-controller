name: Manual module package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Select one exact package coordinate; host and frontend packages are release-only.
        type: choice
        options:
          - swarm-adapter-codex
          - swarm-adapter-command
          - swarm-adapter-claude
          - swarm-antigravity-adapter
          - swarm-adapter-opencode
          - swarm-mcp
          - swarm-cli
          - swarm-gateway
          - swarm-process
          - swarm-script-worker
          - swarm-observer
          - swarm-checks
          - swarm-forge-worker
          - swarm-bus
          - swarm-automation
          - eliot-swarm-controller
        required: true
      profile:
        description: Module packages support iterate/release; host and frontend packages are release-only.
        type: choice
        options:
          - iterate
          - release
        default: iterate
        required: true
permissions:
  contents: read
jobs:
  package:
    name: Build one selected Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install the repository-pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = [regex]::Match((Get-Content -Raw rust-toolchain.toml), '(?m)^\s*channel\s*=\s*"([^"]+)"\s*$')
          if (-not $toolchain.Success) { throw 'rust-toolchain.toml has no exact channel.' }
          rustup toolchain install $toolchain.Groups[1].Value --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve one explicit package coordinate and build its binary
        shell: pwsh
        env:
          MODULE_PACKAGE: ${{ inputs.package }}
          MODULE_PROFILE: ${{ inputs.profile }}
        run: |
          $modulePolicy = Get-Content -Raw 'tools/ci/module-package-policy.json' | ConvertFrom-Json -AsHashtable
          if ($modulePolicy.schema_version -ne 2 -or $modulePolicy.format -cne 'eliot.module_build_policy.v2') {
            throw 'Unsupported module package policy in the selected source revision.'
          }
          $hostPackage = 'eliot-swarm-controller'
          $modulePackages = @(
            $modulePolicy.approved_package_coordinates |
              Where-Object { [string]$_.package_name -cne $hostPackage } |
              ForEach-Object { [string]$_.package_name }
          )
          $frontendPackages = @('swarm-mcp', 'swarm-cli', 'swarm-gateway')
          if ($env:MODULE_PACKAGE -cnotin ($modulePackages + $frontendPackages + $hostPackage)) {
            throw 'Choose exactly one package from the declared workflow input list.'
          }
          $sharedTargetDir = Join-Path $env:RUNNER_TEMP 'eliot-module-shared-target'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'eliot-module-package'
          if (-not (Test-Path -LiteralPath $sharedTargetDir -PathType Container)) {
            [void][IO.Directory]::CreateDirectory($sharedTargetDir)
          }
          if (Test-Path -LiteralPath $artifactDir) {
            throw 'The selected package output directory must be fresh.'
          }
          if ($env:MODULE_PACKAGE -cin $frontendPackages) {
            if ($env:MODULE_PROFILE -cne 'release') {
              throw 'Frontend provenance packages are release-only.'
            }
            & pwsh -NoProfile -File 'tools/ci/Build-SwarmFrontendProvenance.ps1' `
              -Package $env:MODULE_PACKAGE -TargetDir $sharedTargetDir -OutputDir $artifactDir
          }
          elseif ($env:MODULE_PACKAGE -ceq $hostPackage) {
            if ($env:MODULE_PROFILE -cne 'release') {
              throw 'The host provenance package is release-only.'
            }
            & pwsh -NoProfile -File 'tools/ci/Build-SwarmHostProvenance.ps1' `
              -TargetDir $sharedTargetDir -OutputDir $artifactDir
          }
          else {
            & pwsh -NoProfile -File 'tools/ci/build-module-package.ps1' `
              -Package $env:MODULE_PACKAGE -Profile $env:MODULE_PROFILE `
              -TargetDir $sharedTargetDir -OutputDir $artifactDir
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ inputs.package }}-${{ inputs.profile }}-${{ github.sha }}
          path: ${{ runner.temp }}/eliot-module-package/
          if-no-files-found: error
          retention-days: 14
