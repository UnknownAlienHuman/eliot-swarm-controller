name: V2 docs
on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'tools/ci/validate-v2-docs.py'
      - '.github/workflows/v2-docs.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'tools/ci/validate-v2-docs.py'
      - '.github/workflows/v2-docs.yml'
permissions:
  contents: read
jobs:
  links:
    name: Active v2 links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate relative links and GitHub-style anchors
        run: python tools/ci/validate-v2-docs.py
