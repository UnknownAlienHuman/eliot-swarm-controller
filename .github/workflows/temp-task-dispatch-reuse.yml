name: Temporary task dispatch semantic reuse

on:
  push:
    branches:
      - fix/task-dispatch-semantic-reuse

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/task-dispatch-semantic-reuse
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply production slice
        shell: bash
        run: |
          python tools/ci/temp_task_dispatch_reuse.py
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-kernel-host/src/store/operations.rs \
            crates/swarm-kernel-host/src/store/gm_continuation_tests.rs
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/temp-task-dispatch-reuse.yml tools/ci/temp_task_dispatch_reuse.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/operations.rs \
                  crates/swarm-kernel-host/src/store/gm_continuation_tests.rs
          git diff --cached --check
          git commit -m "fix: retain exact task.dispatch reuse receipts"
      - name: Minimal changed-line Clippy
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/eliot-task-dispatch-reuse-target"
          python tools/ci/clippy-attribution.py \
            --base 52bcf9f0b4000452bbc57b713127c8912f5ecbb8 \
            --head HEAD \
            --target-dir "$target_dir" \
            --packages-json '["swarm-kernel-host@0.1.0"]'
      - name: Push qualified commit
        shell: bash
        run: git push origin HEAD:fix/task-dispatch-semantic-reuse
