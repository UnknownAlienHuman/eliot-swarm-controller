name: Antigravity A2a registry finalizer

on:
  push:
    branches:
      - impl/antigravity-a2-delivery-20261024

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: impl/antigravity-a2-delivery-20261024
      - name: Record scoped A2a evidence
        run: python tools/ci/finalize-antigravity-a2a-registry.py
      - name: Publish registry commit
        shell: bash
        run: |
          rm .github/workflows/antigravity-a2a-registry-finalize.yml
          rm tools/ci/finalize-antigravity-a2a-registry.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "docs: record Antigravity A2a delivery slice"
          git push origin HEAD:impl/antigravity-a2-delivery-20261024
