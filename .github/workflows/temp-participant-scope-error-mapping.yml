name: Temporary participant scope error mapping

on:
  push:
    branches:
      - fix/participant-scope-error-mapping

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/participant-scope-error-mapping
          fetch-depth: 0
      - name: Install pinned Rust tools
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Apply error classification repair
        shell: bash
        run: |
          python tools/ci/temp_participant_scope_error_mapping.py
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination.rs
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/temp-participant-scope-error-mapping.yml tools/ci/temp_participant_scope_error_mapping.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/coordination.rs
          git diff --cached --check
          git commit -m "fix: preserve participant scope lookup failures"
      - name: Minimal changed-line Clippy
        shell: bash
        run: |
          target_dir="$RUNNER_TEMP/eliot-participant-scope-error-target"
          python tools/ci/clippy-attribution.py \
            --base 8ca04806cc6f7209d4c1da7ac6aded88c6964126 \
            --head HEAD \
            --target-dir "$target_dir" \
            --packages-json '["swarm-kernel-host@0.1.0"]'
      - name: Push qualified commit
        shell: bash
        run: git push origin HEAD:fix/participant-scope-error-mapping
