name: Temporary Muse pending identity fix

on:
  push:
    branches: [task/audit-04-muse-pending]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task/audit-04-muse-pending
          fetch-depth: 0
      - name: Apply exact bridge patch
        shell: bash
        run: |
          node tools/ci/temp-muse-pending-fix.mjs
          node --check modules/muse/bridge.mjs
          node --check modules/muse/selftest.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('modules/muse/module.example.json','utf8'))"
          git diff --check
      - name: Commit and push product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/muse/bridge.mjs modules/muse/module.example.json docs/remediation/2026-10-07/04-muse-pending.md
          git commit -m "fix(muse): scope pending request identity by session"
          git push origin HEAD:task/audit-04-muse-pending