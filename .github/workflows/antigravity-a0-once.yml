name: Antigravity A0 one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/antigravity-a0-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact A0 replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8", newline="")

          replace_once(
              "modules/antigravity-rust/route.example.toml",
              "# After registration, module.route.select must name descriptor version '5'.\n# Version 5 consumes",
              "# After registration, module.route.select must name descriptor version '6'.\n# Version 6 consumes",
          )

          replace_once(
              "tools/ci/module-package-policy.json",
              '"artifact_id": "eliot-antigravity.rust-headless.1",\n          "version": "5"',
              '"artifact_id": "eliot-antigravity.rust-headless.1",\n          "version": "6"',
          )

          replace_once(
              "tools/qualification/New-NativeQualification.ps1",
              "artifact_id = 'eliot-antigravity.rust-headless.1'; version = '5'; runtime = 'antigravity';",
              "artifact_id = 'eliot-antigravity.rust-headless.1'; version = '6'; runtime = 'antigravity';",
          )

          installer_path = Path("tools/modules/Install-ModuleArtifact.ps1")
          installer = installer_path.read_text(encoding="utf-8")
          start_marker = "function Assert-AntigravityV5DescriptorContract {"
          end_marker = "function Assert-AntigravityNodeV4DescriptorContract {"
          if installer.count(start_marker) != 1 or installer.count(end_marker) != 1:
              raise SystemExit("Antigravity installer validator boundaries changed")
          start = installer.index(start_marker)
          end = installer.index(end_marker, start)
          block = installer[start:end]
          block = block.replace(
              "Assert-AntigravityV5DescriptorContract",
              "Assert-AntigravityV6DescriptorContract",
          )
          block = block.replace(".1 v5 coordinate", ".1 v6 coordinate")
          block = block.replace("artifact.version -ne '5'", "artifact.version -ne '6'")
          block = block.replace("artifact version 5", "artifact version 6")
          block = block.replace("version 5", "version 6")
          if "V5" in block or "version 5" in block or "artifact.version -ne '5'" in block:
              raise SystemExit("Antigravity v5 text remains in the active installer validator")
          installer = installer[:start] + block + installer[end:]
          if installer.count("Assert-AntigravityV5DescriptorContract") != 1:
              raise SystemExit("expected one active installer call to rename")
          installer = installer.replace(
              "Assert-AntigravityV5DescriptorContract -Descriptor $descriptor",
              "Assert-AntigravityV6DescriptorContract -Descriptor $descriptor",
          )
          if "Assert-AntigravityV5DescriptorContract" in installer:
              raise SystemExit("old Antigravity v5 installer validator remains")
          installer_path.write_text(installer, encoding="utf-8", newline="")

          replace_once(
              "crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs",
              '|| !matches!(identity.artifact.version.as_str(), "5" | "6")',
              '|| identity.artifact.version.as_str() != "6"',
          )

          replace_once(
              "docs/agent-operations/module-installation.md",
              "The shipped Rust constant and descriptor are version `6`. Current route example,\npackage policy, native qualification and narrow installer validator still name `5`.\nDo not create another version. Synchronize active selectors to v6 in one source slice;\nleave historical v5 remediation receipts unchanged. After concrete v5 bindings are\ndisposed, remove active `5 | 6` branches.",
              "The shipped Rust constant, descriptor, route example, package policy, native\nqualification and narrow installer validator use version `6`. Historical v5\nremediation receipts remain unchanged. Store no longer accepts v5 as a current\ndispatch capability; concrete old bindings require explicit disposition rather than\na permanent compatibility branch.",
          )

          expected = {
              "crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs",
              "docs/agent-operations/module-installation.md",
              "modules/antigravity-rust/route.example.toml",
              "tools/ci/module-package-policy.json",
              "tools/modules/Install-ModuleArtifact.ps1",
              "tools/qualification/New-NativeQualification.ps1",
          }
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected changed files: {sorted(changed)}")
          PY

      - name: Validate edited formats
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool tools/ci/module-package-policy.json >/dev/null
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw -LiteralPath "tools/modules/Install-ModuleArtifact.ps1")); $null = [scriptblock]::Create((Get-Content -Raw -LiteralPath "tools/qualification/New-NativeQualification.ps1"))'
          rustfmt --edition 2024 --check crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs
          git diff --check

      - name: Minimal warnings-denied Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p swarm-kernel-host --lib --no-deps -- -D warnings

      - name: Commit A0 and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/antigravity-a0-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/swarm-kernel-host/src/store/launcher_dispatch/antigravity_capability.rs \
                  docs/agent-operations/module-installation.md \
                  modules/antigravity-rust/route.example.toml \
                  tools/ci/module-package-policy.json \
                  tools/modules/Install-ModuleArtifact.ps1 \
                  tools/qualification/New-NativeQualification.ps1 \
                  .github/workflows/antigravity-a0-once.yml
          git commit -m 'refactor: align Antigravity active v6 coordinate'
          git push origin HEAD:main
