name: Temporary contract proposal loader patch

on:
  push:
    branches:
      - fix/contract-proposal-loader

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/contract-proposal-loader
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply canonical proposal loader
        shell: bash
        run: |
          python tools/ci/temp_contract_proposal_loader_patch.py
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-kernel-host/src/store/coordination.rs \
            crates/swarm-kernel-host/src/store/coordination_threads.rs
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          git rm \
            .github/workflows/temp-contract-proposal-loader.yml \
            tools/ci/temp_contract_proposal_loader_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/swarm-kernel-host/src/store/coordination.rs \
            crates/swarm-kernel-host/src/store/coordination_threads.rs
          git diff --cached --check
          git commit -m "fix: unify contract proposal revision validation"
          git push origin HEAD:fix/contract-proposal-loader