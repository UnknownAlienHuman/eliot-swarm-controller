name: Temporary participant gap build fix

on:
  push:
    branches:
      - fix/participant-page-scan-cursor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/participant-page-scan-cursor
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Move gap construction outside json macro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/swarm-kernel-host/src/store/coordination.rs")
          text = path.read_text(encoding="utf-8")
          old = (
              "    let partial = more_active || has_unscanned || stale > 0;\n"
              "    Ok(json!({\n"
          )
          new = (
              "    let partial = more_active || has_unscanned || stale > 0;\n"
              "    let gaps = [\n"
              "        (stale > 0).then(|| {\n"
              "            json!({\"kind\":\"stale_participant_index_entries\",\"count\":stale})\n"
              "        }),\n"
              "        has_unscanned\n"
              "            .then(|| json!({\"kind\":\"participant_page_scan_bound\",\"count\":null})),\n"
              "    ]\n"
              "    .into_iter()\n"
              "    .flatten()\n"
              "    .collect::<Vec<_>>();\n"
              "    Ok(json!({\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one participant partial boundary, found {count}")
          text = text.replace(old, new)
          old_gaps = (
              "        \"gaps\": [\n"
              "            (stale > 0).then(|| json!({\"kind\":\"stale_participant_index_entries\",\"count\":stale})),\n"
              "            has_unscanned.then(|| json!({\"kind\":\"participant_page_scan_bound\",\"count\":null})),\n"
              "        ].into_iter().flatten().collect::<Vec<_>>(),\n"
          )
          new_gaps = "        \"gaps\": gaps,\n"
          count = text.count(old_gaps)
          if count != 1:
              raise SystemExit(f"expected one inline gaps expression, found {count}")
          path.write_text(text.replace(old_gaps, new_gaps), encoding="utf-8")
          PY
          rustfmt +1.98.1 --edition 2024 crates/swarm-kernel-host/src/store/coordination.rs
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-participant-gap-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-kernel-host/src/store/coordination.rs
          git diff --cached --check
          git commit -m "fix: build participant gaps before JSON projection"
          git push origin HEAD:fix/participant-page-scan-cursor