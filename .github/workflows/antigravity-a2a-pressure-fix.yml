name: Antigravity A2a restart pressure fix

on:
  push:
    branches:
      - impl/antigravity-a2-delivery-20261024

permissions:
  contents: write

jobs:
  fix-and-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: /tmp/eliot-a2a-pressure-target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: impl/antigravity-a2-delivery-20261024
      - name: Repair restart pressure handling
        run: python tools/ci/fix-antigravity-a2a-restart-pressure.py
      - name: Format affected package
        run: cargo fmt --package swarm-antigravity-adapter
      - name: Minimal warnings-denied Clippy
        run: >-
          cargo clippy --locked
          --package swarm-antigravity-adapter
          --lib --bins -- -D warnings
      - name: Publish fix commit
        shell: bash
        run: |
          rm .github/workflows/antigravity-a2a-pressure-fix.yml
          rm tools/ci/fix-antigravity-a2a-restart-pressure.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(antigravity): drain retained outcomes after restart"
          git push origin HEAD:impl/antigravity-a2-delivery-20261024
