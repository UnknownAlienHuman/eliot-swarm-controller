name: Documentation and source audit consistency

on:
  pull_request:
    paths:
      - .github/workflows/documentation-readiness-audit.yml
      - AGENTS.md
      - README.md
      - docs/**
      - tools/ci/documentation_readiness_audit.py
      - tools/ci/source_surface_inventory.py
      - Cargo.toml
      - crates/**/Cargo.toml
      - modules/**/Cargo.toml
      - src/**
      - crates/swarm-cli/src/**
      - crates/swarm-kernel/src/**
      - crates/swarm-bus/src/**
      - crates/swarm-telemetry/src/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/documentation-readiness-audit.yml
      - AGENTS.md
      - README.md
      - docs/**
      - tools/ci/documentation_readiness_audit.py
      - tools/ci/source_surface_inventory.py
      - Cargo.toml
      - crates/**/Cargo.toml
      - modules/**/Cargo.toml
      - src/**
      - crates/swarm-cli/src/**
      - crates/swarm-kernel/src/**
      - crates/swarm-bus/src/**
      - crates/swarm-telemetry/src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate audit generators
        run: python -m py_compile tools/ci/documentation_readiness_audit.py tools/ci/source_surface_inventory.py
      - name: Regenerate source inventory
        run: python tools/ci/source_surface_inventory.py
      - name: Regenerate documentation inventory
        run: python tools/ci/documentation_readiness_audit.py
      - name: Require controlled handoff verdict
        shell: bash
        run: |
          grep -F 'STRUCTURALLY READY FOR CONTROLLED PACKETED IMPLEMENTATION' docs/agent-operations/documentation-readiness-report.md
          grep -F 'WHOLE-PROJECT SOURCE AUDIT INCOMPLETE' docs/agent-operations/documentation-readiness-report.md
          grep -F 'Approved exact task packets | 1' docs/agent-operations/documentation-readiness-report.md
      - name: Require committed generated evidence
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- \
            docs/agent-operations/source-surface-inventory.md \
            docs/agent-operations/source-surface-inventory.json \
            docs/agent-operations/documentation-readiness-report.md \
            docs/agent-operations/documentation-inventory.json
