name: Antigravity A2 boundary inspection

on:
  push:
    branches:
      - impl/antigravity-a2-delivery-20261024

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: impl/antigravity-a2-delivery-20261024
      - name: Write exact A2 source windows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              'crates/swarm-kernel-host/src/store/runtime.rs': [
                  'pub(super) fn outcome(', 'pub(super) fn outcome_with_artifacts(',
                  'pub(super) fn result(', 'pub(super) fn result_with_artifacts(',
                  'validate_runtime_outcome_identity', 'bridge_boot_id',
                  'previous_owner_departed', 'old_boot', 'recovery_required',
              ],
              'crates/swarm-process/src/permissions.rs': [
                  'pub fn write_private_exact', 'pub fn read_private_durable',
                  'pub fn remove_private_acknowledged', 'pub fn remove_private_durable',
              ],
              'modules/antigravity-rust/src/main.rs': [
                  'async fn run()', 'async fn flush_reports(',
                  'async fn request_saved(', '"agent.result" =>',
                  'fn controller_from_hello(',
              ],
              'modules/antigravity-rust/src/controller.rs': [
                  'pub struct Controller', 'pub fn settle_terminal(',
                  'fn remember_completed_turn(', 'fn record_outcome(',
                  'pub fn acknowledge_outcome(', 'retained_response_for_operation',
              ],
              'modules/antigravity-rust/src/stream.rs': [
                  'fn apply_result(', 'pub fn retained_response_for(',
                  'pub fn terminal_for_after_foreign(',
              ],
              'modules/antigravity-rust/src/process.rs': [
                  'pub struct CandidateManagedOwner', 'pub fn from_environment()',
                  'pub fn from_verified_worker(', 'pub fn clone_for_reconnect(',
              ],
          }
          out = []
          for name, needles in targets.items():
              lines = Path(name).read_text(encoding='utf-8').splitlines()
              out.append(f'===== {name} ({len(lines)} lines) =====')
              emitted = set()
              for needle in needles:
                  hits = [i for i, line in enumerate(lines) if needle in line]
                  out.append(f'--- {needle}: {[i+1 for i in hits]}')
                  for i in hits:
                      start = max(0, i - 32)
                      end = min(len(lines), i + 130)
                      key = (start, end)
                      if key in emitted:
                          continue
                      emitted.add(key)
                      out.append(f'@@ {start+1}:{end} @@')
                      out.extend(f'{n+1:06d} {lines[n]}' for n in range(start, end))
          Path('tools/ci/a2-inspect-output.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
      - name: Publish inspection output
        shell: bash
        run: |
          rm .github/workflows/a2-inspect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: publish temporary A2 source inspection"
          git push origin HEAD:impl/antigravity-a2-delivery-20261024
