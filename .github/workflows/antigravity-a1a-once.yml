name: Antigravity A1a one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/antigravity-a1a-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decouple terminal outcome from observation
        shell: bash
        run: |
          set -euo pipefail
          python tools/ci/antigravity-a1a-once.py

      - name: Format and inspect diff
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            modules/antigravity-rust/src/controller.rs \
            modules/antigravity-rust/src/main.rs \
            crates/swarm-kernel-host/src/runtime/warm_stream.rs \
            crates/swarm-kernel-host/src/store/runtime.rs
          git diff --check

      - name: Minimal adapter Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p swarm-antigravity-adapter --lib --bin swarm-antigravity --no-deps -- -D warnings

      - name: Minimal Store Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p swarm-kernel-host --lib --no-deps -- -D warnings

      - name: Commit A1a and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/antigravity-a1a-once.yml
          rm tools/ci/antigravity-a1a-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/antigravity-rust/src/controller.rs \
                  modules/antigravity-rust/src/main.rs \
                  crates/swarm-kernel-host/src/runtime/warm_stream.rs \
                  crates/swarm-kernel-host/src/store/runtime.rs \
                  .github/workflows/antigravity-a1a-once.yml \
                  tools/ci/antigravity-a1a-once.py
          git commit -m 'refactor: decouple Antigravity terminal outcome from observation'
          git push origin HEAD:main
