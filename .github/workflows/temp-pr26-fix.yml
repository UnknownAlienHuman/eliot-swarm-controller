name: Temporary PR26 compiler fixes

on:
  push:
    branches:
      - fix/compile-head-40591a2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/compile-head-40591a2
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply exact cross-platform fixes
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'return swarm_process::departed_empty(&identity, service_owner_token);' crates/swarm-automation/src/lib.rs \
             && grep -q 'tasks::get_attempt(tx, attempt_id)?;' crates/swarm-kernel-host/src/store/code_scopes.rs; then
            echo 'patch already applied'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'crates/swarm-automation/src/lib.rs',
              '''    let identity = identity.clone();
    #[cfg(windows)]
    {
        identity["job_name"] = serde_json::json!(format!(
            "Global\\\\EliotSwarmService-AutomationScheduler-{service_owner_token}"
        ));
    }
    swarm_process::departed_empty(&identity, service_owner_token)
''',
              '''    #[cfg(windows)]
    {
        let mut identity = identity.clone();
        identity["job_name"] = serde_json::json!(format!(
            "Global\\\\EliotSwarmService-AutomationScheduler-{service_owner_token}"
        ));
        return swarm_process::departed_empty(&identity, service_owner_token);
    }
    #[cfg(not(windows))]
    {
        swarm_process::departed_empty(identity, service_owner_token)
    }
''',
          )
          replace_exact(
              'crates/swarm-kernel-host/src/store/code_scopes.rs',
              '''    let attempt = tasks::get_attempt(tx, &attempt_id)?;
    let scope_intent_id = format!("cscope-{}", model::new_id());
    let sequence = next_task_sequence(tx, &task_id)?;
''',
              '''    tasks::get_attempt(tx, attempt_id)?;
    let scope_intent_id = format!("cscope-{}", model::new_id());
    let sequence = next_task_sequence(tx, task_id)?;
''',
          )
          replace_exact(
              'crates/swarm-kernel-host/src/store/code_scopes.rs',
              '        &task_page_key(&task_id, sequence)?,\n',
              '        &task_page_key(task_id, sequence)?,\n',
          )
          PY
          rustfmt +1.98.1 --edition 2024 \
            crates/swarm-automation/src/lib.rs \
            crates/swarm-kernel-host/src/store/code_scopes.rs
      - name: Commit and push product fixes
        shell: bash
        run: |
          if git diff --quiet -- \
            crates/swarm-automation/src/lib.rs \
            crates/swarm-kernel-host/src/store/code_scopes.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/swarm-automation/src/lib.rs \
            crates/swarm-kernel-host/src/store/code_scopes.rs
          git diff --cached --check
          git commit -m "fix: preserve scheduler owner identity across platforms"
          git push origin HEAD:fix/compile-head-40591a2