name: Temporary PR26 compiler fixes

on:
  push:
    branches: [fix/compile-head-40591a2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/compile-head-40591a2
          fetch-depth: 0
      - name: Install pinned rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply exact patches
        shell: bash
        run: |
          python tools/ci/temp-pr26-fix.py
          rustfmt +1.98.1 --edition 2024 crates/swarm-automation/src/lib.rs crates/swarm-kernel-host/src/store/code_scopes.rs
      - name: Commit and push product fixes
        shell: bash
        run: |
          if git diff --quiet -- crates/swarm-automation/src/lib.rs crates/swarm-kernel-host/src/store/code_scopes.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-automation/src/lib.rs crates/swarm-kernel-host/src/store/code_scopes.rs
          git diff --cached --check
          git commit -m "fix: preserve scheduler owner identity across platforms"
          git push origin HEAD:fix/compile-head-40591a2