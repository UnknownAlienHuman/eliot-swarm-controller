name: Temporary PR26 Clippy fix

on:
  push:
    branches: [fix/compile-head-40591a2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/compile-head-40591a2
          fetch-depth: 0
      - name: Apply exact warning fix
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('crates/swarm-automation/src/lib.rs'); s=p.read_text(encoding='utf-8'); old='        return swarm_process::departed_empty(&identity, service_owner_token);'; new='        swarm_process::departed_empty(&identity, service_owner_token)'; assert s.count(old) == 1; p.write_text(s.replace(old, new), encoding='utf-8')"
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-automation/src/lib.rs
          git commit -m "fix: satisfy Windows Clippy in scheduler owner check"
          git push origin HEAD:fix/compile-head-40591a2