[workspace]
members = [
    "crates/eliot",
    "crates/eliot-core",
    "crates/eliot-store",
    "crates/eliot-plugin",
    "crates/eliot-daemon",
]
resolver = "3"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
eliot-core = { path = "crates/eliot-core" }
eliot-store = { path = "crates/eliot-store" }
eliot-plugin = { path = "crates/eliot-plugin" }
eliot-daemon = { path = "crates/eliot-daemon" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = { version = "0.3.34", features = ["sink"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"
ulid = "1.2"
libc = "0.2.190"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
