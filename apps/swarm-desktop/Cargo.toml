[package]
name = "swarm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "swarm-desktop"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eliot-core.workspace = true
eliot-daemon.workspace = true
futures-util.workspace = true
# First code import of material-colors 0.5.0
# (https://github.com/Aiving/material-colors), MIT OR Apache-2.0,
# rust-version 1.97, a port of Google's material-color-utilities
# (https://github.com/material-foundation/material-color-utilities, Apache-2.0).
# Used as a library for HCT tonal palettes and the M3 dynamic scheme roles;
# default features only (no runtime dependencies); no source copied.
material-colors = "=0.5.0"
# First code import of pulldown-cmark 0.13.1
# (https://github.com/pulldown-cmark/pulldown-cmark), MIT, rust-version 1.71.1.
# Used directly as a pull parser (no HTML renderer, no CLI); no source copied.
pulldown-cmark = { version = "=0.13.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.2", features = ["rt", "net", "time", "macros"] }
ulid.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
# First real code import of windows-reactor: Microsoft windows-rs 0.100.0
# (https://github.com/microsoft/windows-rs), MIT OR Apache-2.0, rust-version
# 1.95, below the pinned workspace toolchain 1.99.1. License texts live in
# the crate (license-mit / license-apache-2.0); no donor source is copied,
# the library is used directly. WinUI staging at runtime uses Reactor's own
# bootstrap inside App::run; no self-contained exe is promised.
windows-reactor = "=0.100.0"
# The same windows-rs 0.100.0 crates Reactor depends on, for the four WinUI
# calls Reactor does not expose: the application's theme dictionaries
# (`app_resources`). No new crate versions enter the lockfile.
windows-collections = { version = "=0.100.0", default-features = false, features = ["std"] }
windows-core = { version = "=0.100.0", default-features = false }
windows-reference = { version = "=0.100.0", default-features = false, features = ["std"] }
# Clipboard (Reactor 0.100.0 has no clipboard API) and the High Contrast
# check (Reactor reports Light/Dark only): the workspace pin.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # The per-user settings folder (SHGetKnownFolderPath) and CoTaskMemFree.
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    # High Contrast detection (SPI_GETHIGHCONTRAST) for the theme fallback.
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
